# ============================================================================
# docker-compose.yml — Wrapper Hub (lu par Dokploy en mode GitOps)
# ============================================================================
#
# Dokploy clone ce repo et lance `docker compose up` sur ce fichier.
# Compose 2.20+ résout `include:` automatiquement → merge base + prod.
#
# Source de vérité :
#   - compose/base.yml     (commun prod + staging)
#   - compose/prod.yml     (override production)
#   - compose/staging.yml  (override staging, jamais utilisé en prod)
#
# Pour staging (sur dev server), la CI lance directement :
#   docker compose -f compose/base.yml -f compose/staging.yml up -d
#
# Garde-fou CI :
# - `scripts/ci/check-compose-sync.sh` vérifie que les 3 sources rendent
#   un compose valide.
# ============================================================================

name: veridian-hub

include:
  - path:
      - compose/base.yml
      - compose/prod.yml

# ============================================================================
# compose/prod.yml — Override production
# ============================================================================
#
# Combiné avec base.yml. Lu par Dokploy via le consolidé `docker-compose.yml`
# à la racine (généré automatiquement, cf base.yml header).
#
# Réseau : dokploy-network (Traefik Dokploy de prod)
# DB : veridian-core-db partagée (schema hub_app)
# Stripe : keys LIVE
# URLs : app.veridian.site + sous-domaines prod
# ============================================================================

services:
  hub:
    networks:
      - dokploy-network
    environment:
      # ─── Env tag ───────────────────────────────────────────────────────
      DEPLOY_ENV: ${DEPLOY_ENV:-prod}

      # ─── Auth.js prod ──────────────────────────────────────────────────
      AUTH_SECRET: ${HUB_AUTH_SECRET}
      AUTH_URL: https://app.veridian.site
      NEXTAUTH_URL: https://app.veridian.site
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}

      # ─── Mail Gateway v1 — OAuth Client 2 "Veridian Mail Sender" ──────
      # Client OAuth Google séparé du sign-in (Client 1). Scope sensitive
      # `gmail.send` isolé pour ne pas mélanger la brand verification.
      # Redirect URI prod = https://app.veridian.site/api/gmail/connect/callback
      # (déclarée en Console Google le 2026-05-25).
      # ENV à poser dans Dokploy stack Hub prod (composeId
      # _kxAHDCv1LhvsdwNRX3Vk) — valeurs dans ~/credentials/.all-creds.env.
      GOOGLE_MAIL_CLIENT_ID: ${GOOGLE_MAIL_CLIENT_ID:-}
      GOOGLE_MAIL_CLIENT_SECRET: ${GOOGLE_MAIL_CLIENT_SECRET:-}

      # ─── DB prod partagée ──────────────────────────────────────────────
      DATABASE_URL: postgresql://veridian:${VERIDIAN_CORE_DB_PASSWORD}@veridian-core-db:5432/veridian?schema=hub_app

      # ─── Stripe LIVE ───────────────────────────────────────────────────
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY_LIVE}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE: ${STRIPE_PUBLISHABLE_KEY_LIVE}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY_LIVE}
      STRIPE_SECRET_KEY_LIVE: ${STRIPE_SECRET_KEY_LIVE}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET_LIVE}
      STRIPE_WEBHOOK_SECRET_LIVE: ${STRIPE_WEBHOOK_SECRET_LIVE}
      # Product refill leads Prospection (Checkout one-shot — prix dynamique)
      STRIPE_REFILL_PRODUCT_ID_LIVE: ${STRIPE_REFILL_PRODUCT_ID_LIVE}

      # ─── URLs prod ─────────────────────────────────────────────────────
      NEXT_PUBLIC_SITE_URL: https://app.veridian.site
      DASHBOARD_SITE_URL: https://app.veridian.site
      DOMAIN: app.veridian.site

      # ─── Notifuse prod ─────────────────────────────────────────────────
      NEXT_PUBLIC_NOTIFUSE_URL: https://notifuse.app.veridian.site
      NEXT_PUBLIC_NOTIFUSE_API_URL: https://notifuse.app.veridian.site/api/v1
      NOTIFUSE_API_URL: https://notifuse.app.veridian.site
      NOTIFUSE_API_ENDPOINT: https://notifuse.app.veridian.site
      NOTIFUSE_SECRET_KEY: ${NOTIFUSE_SECRET_KEY}
      NOTIFUSE_ROOT_EMAIL: ${NOTIFUSE_ROOT_EMAIL}
      NOTIFUSE_HUB_API_SECRET: ${NOTIFUSE_HUB_API_SECRET}
      NOTIFUSE_HUB_WEBHOOK_SECRET: ${NOTIFUSE_HUB_WEBHOOK_SECRET}
      # Bearer token v1.4 — Notifuse l'envoie en `Authorization: Bearer`
      # quand il POST sur /api/webhooks/notifuse (events tenant.touched,
      # tenant.activity_threshold_reached, etc.). Convention §7.1 contrat.
      NOTIFUSE_WEBHOOK_TOKEN: ${NOTIFUSE_WEBHOOK_TOKEN}

      # ─── Prospection prod ──────────────────────────────────────────────
      NEXT_PUBLIC_PROSPECTION_URL: https://prospection.app.veridian.site
      PROSPECTION_API_URL: https://prospection.app.veridian.site
      PROSPECTION_INTERNAL_URL: https://prospection.app.veridian.site
      PROSPECTION_TENANT_API_SECRET: ${PROSPECTION_TENANT_API_SECRET}
      # Bearer token v1.4 — Prospection POST /api/webhooks/prospection.
      PROSPECTION_WEBHOOK_TOKEN: ${PROSPECTION_WEBHOOK_TOKEN}

      # ─── Analytics prod ────────────────────────────────────────────────
      # URL admin API (Pattern A legacy x-admin-key — lib/analytics/client.ts).
      ANALYTICS_API_URL: ${ANALYTICS_API_URL:-https://analytics.app.veridian.site}
      ANALYTICS_ADMIN_KEY: ${ANALYTICS_ADMIN_KEY:-}
      # HMAC partagé Hub ↔ Analytics bridge (contrat v1 §6.1 — sprint B3).
      # Valeur dans ~/credentials/.all-creds.env (ANALYTICS_HUB_API_SECRET,
      # = ANALYTICS_ENGINE_PROD_HUB_HMAC_SECRET côté Analytics). À injecter
      # dans Dokploy ENV stack Hub prod le jour du câblage du client HMAC
      # Hub→Analytics (ticket veridian-analytics
      # `2026-05-20-hub-integration-when-saas-launched.md`).
      ANALYTICS_HUB_API_SECRET: ${ANALYTICS_HUB_API_SECRET:-}

      # ─── CRM Veridian (fork Twenty AGPLv3) ─────────────────────────────
      # Prod URL à fixer quand crm.veridian.site sera déployé (en attente).
      # Pattern API consumption pure : Bearer token Twenty stocké chiffré
      # par tenant, pas de HMAC bidirectionnel. Cf todo
      # 2026-05-27-route-admin-create-crm-tenant.md pour le flow complet.
      CRM_METADATA_URL: ${CRM_METADATA_URL:-https://crm.veridian.site/metadata}
      CRM_REST_URL: ${CRM_REST_URL:-https://crm.veridian.site/rest}
      CRM_FRONTEND_URL: ${CRM_FRONTEND_URL:-https://crm.veridian.site}

      # ─── Services tiers prod ───────────────────────────────────────────
      BREVO_API_KEY: ${BREVO_API_KEY}
      CRON_SECRET: ${CRON_SECRET}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY}
      NEXT_PUBLIC_GTM_ID: ${GTM_ID_APP_VERIDIAN}
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.hub-${DEPLOY_ENV:-prod}-web.entrypoints=web
      - traefik.http.routers.hub-${DEPLOY_ENV:-prod}-web.rule=Host(`${HUB_HOST:-app.veridian.site}`)
      - traefik.http.routers.hub-${DEPLOY_ENV:-prod}-web.middlewares=redirect-to-https@file
      - traefik.http.routers.hub-${DEPLOY_ENV:-prod}-websecure.entrypoints=websecure
      - traefik.http.routers.hub-${DEPLOY_ENV:-prod}-websecure.rule=Host(`${HUB_HOST:-app.veridian.site}`)
      - traefik.http.routers.hub-${DEPLOY_ENV:-prod}-websecure.tls=true
      - traefik.http.routers.hub-${DEPLOY_ENV:-prod}-websecure.tls.certresolver=letsencrypt
      - traefik.http.services.hub-${DEPLOY_ENV:-prod}.loadbalancer.server.port=3000

networks:
  dokploy-network:
    external: true

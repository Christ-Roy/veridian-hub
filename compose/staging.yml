# ============================================================================
# compose/staging.yml — Override staging (dev server, hub.staging.veridian.site)
# ============================================================================
#
# Convention officielle Veridian (cf CLAUDE.md racine §Staging) :
#   - 1 seule stack staging par app (pas d'éphémère par PR)
#   - URL fixe : hub.staging.veridian.site
#   - Trigger : push sur branche `staging` du repo veridian-hub
#   - Network external : staging-edge (Traefik standalone sur dev)
#   - DB : Postgres locale à la stack (pas la prod, pas de partage)
#
# Combiné avec base.yml :
#   docker compose -f compose/base.yml -f compose/staging.yml up -d
#
# Variables d'env attendues (injectées par le workflow CI via .env sur dev) :
#   HUB_IMAGE_TAG      = staging-<sha7> (image build par la CI sur push staging)
#   HUB_AUTH_SECRET    = secret AUTH.js staging (random 32 bytes, stable)
#   POSTGRES_PASSWORD  = mot de passe DB staging
#
# Optionnels (fallback values pour permettre au container de démarrer) :
#   GOOGLE_OAUTH_CLIENT_ID_STAGING / _SECRET_STAGING
#   MICROSOFT_OAUTH_CLIENT_ID_STAGING / _SECRET_STAGING
#   NOTIFUSE_*_STAGING
#   PROSPECTION_TENANT_API_SECRET_STAGING
# ============================================================================

services:
  hub:
    container_name: hub-staging
    networks:
      - staging-edge
      - hub-internal
    depends_on:
      hub-db:
        condition: service_healthy
    environment:
      DEPLOY_ENV: staging

      # ─── Mock OAuth provider (E2E only) ───────────────────────────────
      # Active le mock provider Auth.js v5 sur staging uniquement. Le code
      # `lib/auth/mock-oauth-provider.ts` refuse de booter en prod (triple
      # garde-fou). Le CI `scripts/ci/check-no-test-provider-in-prod.sh`
      # bloque l'apparition de cette variable dans compose/prod.yml.
      # Filet de sécurité supplémentaire : l'invariant CI grep aussi
      # compose/base.yml. Ne JAMAIS déplacer ce flag dans base.yml.
      OAUTH_TEST_PROVIDER: "true"

      # ─── Auth.js staging ───────────────────────────────────────────────
      AUTH_SECRET: ${HUB_AUTH_SECRET:-staging-not-secret-replace-me}
      AUTH_URL: https://hub.staging.veridian.site
      NEXTAUTH_URL: https://hub.staging.veridian.site
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID_STAGING:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET_STAGING:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID_STAGING:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET_STAGING:-}

      # ─── Mail Gateway v1 — OAuth Client 2 "Veridian Mail Sender" ──────
      # Client OAuth Google distinct du sign-in (Client 1). Scope sensitive
      # `gmail.send` isolé pour ne pas mélanger la brand verification.
      # Cf. todo/done/2026-05-25-oauth-google-gmail-client-2-setup-console.md.
      # Mêmes valeurs que prod (1 seul Client OAuth couvre les 3 hosts via
      # redirect URIs déclarées en Console).
      GOOGLE_MAIL_CLIENT_ID: ${GOOGLE_MAIL_CLIENT_ID_STAGING:-}
      GOOGLE_MAIL_CLIENT_SECRET: ${GOOGLE_MAIL_CLIENT_SECRET_STAGING:-}

      # ─── DB locale à la stack ──────────────────────────────────────────
      DATABASE_URL: postgresql://hub:${POSTGRES_PASSWORD:-staging-pwd}@hub-db:5432/hub?schema=hub_app

      # ─── Stripe TEST ───────────────────────────────────────────────────
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY_TEST:-pk_test_fake}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE: ${STRIPE_PUBLISHABLE_KEY_TEST:-pk_test_fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY_TEST:-sk_test_fake}
      STRIPE_SECRET_KEY_LIVE: ${STRIPE_SECRET_KEY_TEST:-sk_test_fake}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET_TEST:-whsec_fake}
      STRIPE_WEBHOOK_SECRET_LIVE: ${STRIPE_WEBHOOK_SECRET_TEST:-whsec_fake}
      # Product refill leads — isProduction() retourne false sur staging
      # (DOMAIN=staging.veridian.site) donc utils/env.ts lit _TEST.
      STRIPE_REFILL_PRODUCT_ID_TEST: ${STRIPE_REFILL_PRODUCT_ID_TEST:-prod_refill_fake}

      # ─── URLs staging ──────────────────────────────────────────────────
      NEXT_PUBLIC_SITE_URL: https://hub.staging.veridian.site
      DASHBOARD_SITE_URL: https://hub.staging.veridian.site
      DOMAIN: hub.staging.veridian.site

      # ─── Notifuse staging (pointe vers prod si pas de staging) ─────────
      NEXT_PUBLIC_NOTIFUSE_URL: https://notifuse.staging.veridian.site
      NEXT_PUBLIC_NOTIFUSE_API_URL: https://notifuse.staging.veridian.site/api/v1
      NOTIFUSE_API_URL: https://notifuse.staging.veridian.site
      NOTIFUSE_API_ENDPOINT: https://notifuse.staging.veridian.site
      NOTIFUSE_SECRET_KEY: ${NOTIFUSE_SECRET_KEY_STAGING:-staging-secret}
      NOTIFUSE_ROOT_EMAIL: ${NOTIFUSE_ROOT_EMAIL:-admin@veridian.site}
      NOTIFUSE_HUB_API_SECRET: ${NOTIFUSE_HUB_API_SECRET_STAGING:-staging-secret}
      NOTIFUSE_HUB_WEBHOOK_SECRET: ${NOTIFUSE_HUB_WEBHOOK_SECRET_STAGING:-staging-secret}
      # Bearer token v1.4 — fallback staging-token-not-real autorise les tests
      # locaux mais l'auth bloque tant que le secret réel n'est pas injecté.
      NOTIFUSE_WEBHOOK_TOKEN: ${NOTIFUSE_WEBHOOK_TOKEN:-staging-token-not-real}

      # ─── Prospection ───────────────────────────────────────────────────
      NEXT_PUBLIC_PROSPECTION_URL: https://prospection.staging.veridian.site
      PROSPECTION_API_URL: https://prospection.staging.veridian.site
      PROSPECTION_INTERNAL_URL: https://prospection.staging.veridian.site
      PROSPECTION_TENANT_API_SECRET: ${PROSPECTION_TENANT_API_SECRET_STAGING:-staging-secret}
      PROSPECTION_WEBHOOK_TOKEN: ${PROSPECTION_WEBHOOK_TOKEN:-staging-token-not-real}

      # ─── Analytics ─────────────────────────────────────────────────────
      # URL admin API (Pattern A legacy x-admin-key — lib/analytics/client.ts).
      ANALYTICS_API_URL: ${ANALYTICS_API_URL_STAGING:-https://analytics-engine.staging.veridian.site}
      ANALYTICS_ADMIN_KEY: ${ANALYTICS_ADMIN_KEY_STAGING:-}
      # HMAC partagé Hub ↔ Analytics bridge (contrat v1 §6.1 — sprint B3).
      # Secret réel généré 2026-05-22 (HUB_HMAC_SECRET_ANALYTICS_STAGING dans
      # ~/credentials/.all-creds.env, aussi exposé sous le nom canonique
      # ANALYTICS_HUB_API_SECRET_STAGING). Fallback safe pour les boots
      # locaux sans CI : tous les appels HMAC seront refusés côté bridge
      # (mismatch attendu). Côté Analytics bridge la var s'appelle
      # HUB_HMAC_SECRET et porte la même valeur.
      ANALYTICS_HUB_API_SECRET: ${ANALYTICS_HUB_API_SECRET_STAGING:-staging-analytics-hub-secret-not-real-e2e}

      # ─── Services tiers staging ────────────────────────────────────────
      BREVO_API_KEY: ${BREVO_API_KEY_STAGING:-}
      CRON_SECRET: staging-cron-secret
      VAULT_ENC_KEY: ${VAULT_ENC_KEY_STAGING:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      NEXT_PUBLIC_GTM_ID: ""

      # ─── Admin API + Invitation HMAC (E2E only) ────────────────────────
      # Valeurs publiques exposées uniquement sur staging (Tailscale-only,
      # pas de surface Internet). Permettent à la suite E2E
      # `e2e/staging-full/` d'attaquer les routes /api/admin/* et
      # /api/invitations/create sans avoir à injecter des secrets via CI.
      # En prod : valeurs réelles dans Dokploy ENV (cf
      # `~/credentials/.all-creds.env`), JAMAIS hardcodées.
      ADMIN_SECRET: ${ADMIN_SECRET_STAGING:-staging-admin-secret-not-real-e2e}
      HUB_INVITATION_SECRET_NOTIFUSE: ${HUB_INVITATION_SECRET_NOTIFUSE_STAGING:-staging-invitation-secret-notifuse-not-real-e2e}
      HUB_INVITATION_SECRET_PROSPECTION: ${HUB_INVITATION_SECRET_PROSPECTION_STAGING:-staging-invitation-secret-prospection-not-real-e2e}
      HUB_INVITATION_SECRET_ANALYTICS: ${HUB_INVITATION_SECRET_ANALYTICS_STAGING:-staging-invitation-secret-analytics-not-real-e2e}
      HUB_INVITATION_SECRET_CMS: ${HUB_INVITATION_SECRET_CMS_STAGING:-staging-invitation-secret-cms-not-real-e2e}

      # ─── Bypass rate-limit admin (E2E staging only) ─────────────────────
      # Activé côté Hub via lib/auth/rate-limit.ts → shouldBypassRateLimit().
      # Triple garde-fou : DEPLOY_ENV !== 'prod' + secret ≥ 32 chars + timing-safe.
      # Sans ce secret valide, la cascade rate-limit /api/admin/users/create
      # fait tomber 5 specs E2E (13, 05, 15, 07, 11). Cf ticket
      # 2026-05-23-e2e-fix-admin-rate-limit-cascade.md.
      # Côté E2E runner : sourced auto depuis ~/credentials/.all-creds.env
      # par scripts/e2e/staging-full.sh.
      E2E_RATELIMIT_BYPASS_SECRET: ${E2E_RATELIMIT_BYPASS_SECRET:-}
    labels:
      - traefik.enable=true
      - traefik.docker.network=staging-edge
      - traefik.http.routers.hub.rule=Host(`hub.staging.veridian.site`)
      - traefik.http.routers.hub.entrypoints=websecure
      - traefik.http.routers.hub.tls=true
      - traefik.http.routers.hub.tls.certresolver=letsencrypt
      - traefik.http.services.hub.loadbalancer.server.port=3000
      - veridian.staging.app=hub

  # ─── Postgres staging (DB locale à la stack) ─────────────────────────
  # Volume nommé pour persister entre les redeploys (au contraire de
  # l'ancienne version qui mettait tout en éphémère).
  hub-db:
    image: postgres:16-alpine
    container_name: hub-staging-db
    restart: unless-stopped
    networks:
      - hub-internal
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging-pwd}
      POSTGRES_DB: hub
    volumes:
      - hub-staging-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - veridian.staging.app=hub

networks:
  staging-edge:
    external: true
  hub-internal:
    driver: bridge

volumes:
  hub-staging-pgdata:
    name: hub-staging-pgdata

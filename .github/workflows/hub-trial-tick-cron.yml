name: Hub — Trial state machine tick (every 30 min)

# Cron qui pilote la trial state machine cross-app (cf
# `docs/PRICING-VERIDIAN.md` §"Flow trial complet" et
# `todo/2026-05-21-trial-state-machine.md`) :
#
#   - eligible (5e mail Notifuse + 48h) → trial_active + update-plan plan=pro
#   - trial_active (12j) → email "expire dans 3j"
#   - trial_active (15j) sans Stripe sub → expired + update-plan plan=free
#   - trial_active (15j) avec Stripe sub → converted (no-op)
#
# 30 minutes = compromis entre :
#   - réactivité (un trial activé à H+47:30 sera ~30 min en retard, pas 24h)
#   - coût CI (48 runs/jour × 5s = 4 min CI/jour, négligeable)
#
# Secret `CRON_SECRET` : à provisionner dans GH Secrets si pas déjà fait
# (`gh secret set CRON_SECRET -R Christ-Roy/veridian-hub`).
# La valeur doit matcher l'ENV `CRON_SECRET` du compose prod (cf
# `compose/prod.yml` ligne 71).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial-tick:
    name: Tick trial state machine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/trial-tick on prod
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant dans GH Secrets"
            exit 1
          fi

          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://app.veridian.site/api/cron/trial-tick" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 60 \
            --retry 2 --retry-delay 5)

          echo "HTTP $HTTP_CODE"
          cat /tmp/resp.json || true
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Trial tick failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Notify Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id=${TG_CHAT} \
            -d parse_mode=Markdown \
            -d "text=Trial tick cron *FAIL*. Run : ${RUN_URL}" \
            >/dev/null || true

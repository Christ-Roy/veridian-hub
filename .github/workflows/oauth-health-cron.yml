name: Hub — OAuth health cron (monthly)

# Cron mensuel : vérifie expiration secret Microsoft Entra + disponibilité
# discovery doc Google. Alerte Telegram si problème.
#
# Référence : scripts/cron/oauth-health-check.ts
# Runbook    : runbooks/services/hub/oauth-smoke.md
# Ticket     : todo/2026-05-21-test-coverage-audit-and-oauth-e2e.md (P1)

on:
  schedule:
    - cron: '0 3 1 * *'   # Le 1er de chaque mois à 3h UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-health:
    name: Check OAuth providers health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install minimal deps for tsx
        run: pnpm install --frozen-lockfile --prod=false

      - name: Run OAuth health check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MICROSOFT_OAUTH_TENANT_ID: ${{ secrets.MICROSOFT_OAUTH_TENANT_ID }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_CLIENT_SECRET: ${{ secrets.MICROSOFT_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_OBJECT_ID: ${{ secrets.MICROSOFT_OAUTH_OBJECT_ID }}
        run: pnpm exec tsx scripts/cron/oauth-health-check.ts

      - name: Notify Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id=${TG_CHAT} \
            -d parse_mode=Markdown \
            -d "text=🚨 OAuth health cron *FAIL*. Run : ${RUN_URL}" \
            >/dev/null || true

name: Hub — OAuth health cron (monthly)

# Cron mensuel : vérifie expiration secret Microsoft Entra + disponibilité
# discovery doc Google. Alerte Telegram si problème.
#
# Référence : scripts/cron/oauth-health-check.ts
# Runbook    : runbooks/services/hub/oauth-smoke.md
# Ticket     : todo/2026-05-21-test-coverage-audit-and-oauth-e2e.md (P1)

on:
  schedule:
    - cron: '0 3 1 * *'   # Le 1er de chaque mois à 3h UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-health:
    name: Check OAuth providers health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install minimal deps for tsx
        run: pnpm install --frozen-lockfile --prod=false

      - name: Run OAuth health check
        env:
          MICROSOFT_OAUTH_TENANT_ID: ${{ secrets.MICROSOFT_OAUTH_TENANT_ID }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_CLIENT_SECRET: ${{ secrets.MICROSOFT_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_OBJECT_ID: ${{ secrets.MICROSOFT_OAUTH_OBJECT_ID }}
        run: pnpm exec tsx scripts/cron/oauth-health-check.ts

      - name: Notify alerte Loki (relais du Hub) on failure
        if: failure()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Grafana seule source d'alertes (27/11) : le Hub écrit la ligne flux=alerte que Loki lit (app/api/cron/alerte).
          [ -n "$CRON_SECRET" ] || { echo "::warning::CRON_SECRET absent : alerte non relayée"; exit 0; }
          corps=$(jq -nc --arg e "ci.oauth_health" --arg m "🚨 OAuth health cron FAIL" --arg l "$RUN_URL" '{evenement:$e,gravite:"erreur",message:$m,lien:$l}')
          code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST https://app.veridian.site/api/cron/alerte -H "Authorization: Bearer $CRON_SECRET" -H "content-type: application/json" --data "$corps" || echo 000)
          [ "$code" = 200 ] || echo "::warning::alerte non relayée par le Hub (HTTP $code)"

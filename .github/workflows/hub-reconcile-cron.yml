name: Hub — Reconcile tenants (hourly)

# Cron qui exécute la réconciliation périodique (Niveau 3 du tenant sync —
# cf todo/2026-05-20-tenant-sync-strategy.md).
#
# Compare snapshot Hub vs discoverUserApps(email) pour les tenants actifs,
# logue les drifts détectés (Loki) et alerte Telegram si > seuil.
#
# Mode DRY-RUN ONLY pour P0 (pas d'auto-repair) — voir
# lib/sync/reconcile.ts pour le rationale.
#
# Fréquence horaire = compromis entre :
#   - réactivité : drift de plan/status remonté en < 1h sans webhook
#   - coût : 24 runs/jour × ~10s = 4 min CI/jour, négligeable
#   - charge apps downstream : 24 × 100 tenants × 3 apps = 7200 GET /jour, OK
#
# Secret `CRON_SECRET` : déjà provisionné côté `hub-trial-tick-cron.yml`.
# Pas de nouveau secret à créer.

on:
  schedule:
    - cron: '17 * * * *' # h+17 pour étaler vs trial-tick (toutes les 30 min)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Tenants à scanner (1..500)'
        required: false
        default: '100'
      apps:
        description: 'Apps à interroger (csv: notifuse,prospection,analytics)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile tenants
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/cron/reconcile-tenants on prod
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LIMIT: ${{ github.event.inputs.limit || '100' }}
          APPS: ${{ github.event.inputs.apps || '' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant dans GH Secrets"
            exit 1
          fi

          QS="limit=${LIMIT}"
          if [ -n "$APPS" ]; then
            QS="${QS}&apps=${APPS}"
          fi
          URL="https://app.veridian.site/api/cron/reconcile-tenants?${QS}"

          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 300 \
            --retry 2 --retry-delay 10)

          echo "HTTP $HTTP_CODE"
          # Logs Actions publics : la réponse brute porte les adresses de test (restes) et la liste
          # des dérives. On n'imprime que des comptes.
          jq -c '{ok, usersScanned, driftsDetected, appsUnreachable, identity,
                  testResidue: (if .testResidue then {total: .testResidue.total,
                    hub: (.testResidue.hub | length), tenantsWithoutUser: .testResidue.tenantsWithoutUser,
                    notifuseWorkspaces: (.testResidue.notifuseWorkspaces | length?)} else null end)}' \
            /tmp/resp.json || echo "(réponse non lisible)"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Reconcile tick failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      # Restes de test (comptes de batterie au Hub et dans les apps, workspaces Notifuse, tenants sans
      # utilisateur). Trois états : mesuré sous le seuil (vert, annotation si non nul), mesuré
      # au-dessus (rouge + Telegram), non mesuré (annotation : le Hub servi est plus ancien que la mesure).
      # Seuil explicite : RESIDUE_SEUIL (variable du dépôt), 0 par défaut : tout reste alerte. Liste : `hub reconcile`.
      - name: Restes de test sous le seuil
        id: residu
        env:
          SEUIL: ${{ vars.RESIDUE_SEUIL || '0' }}
        run: |
          TOTAL=$(jq -r '.testResidue.total // "absent"' /tmp/resp.json)
          case "$TOTAL" in
            absent)
              echo "::warning::Restes de test non mesurés (le Hub servi ne les renvoie pas)."
              ;;
            ''|*[!0-9]*)
              echo "::error::Restes de test: valeur illisible ($TOTAL)"
              exit 1
              ;;
            *)
              if [ "$TOTAL" -gt "$SEUIL" ]; then
                echo "::error::Restes de test: $TOTAL au-dessus du seuil $SEUIL. Lister avec 'hub reconcile', retirer avec delete-tenant."
                exit 1
              elif [ "$TOTAL" -gt 0 ]; then
                echo "::warning::Restes de test: $TOTAL (seuil $SEUIL, restes connus)."
              else
                echo "Restes de test: 0"
              fi
              ;;
          esac

      - name: Notify Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESIDU: ${{ steps.residu.outcome == 'failure' && '1' || '' }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id=${TG_CHAT} \
            -d parse_mode=Markdown \
            -d "text=Reconcile tenants cron *FAIL*${RESIDU:+ (restes de test au-dessus du seuil)}. Run : ${RUN_URL}" \
            >/dev/null || true

name: Hub — Security cron (Trivy daily)

# Cron quotidien Trivy sur l'image hub deployed (latest tag GHCR).
# Détecte les CVE upstream sorties APRÈS le merge (entre 2 builds).
# Si CRIT/HIGH apparaît : ce workflow fail et l'agent CI hub doit ouvrir une PR de bump.
# Référence : SPRINT-GITOPS-VERIDIAN.md "Cron Trivy quotidien".

on:
  schedule:
    - cron: '0 3 * * *'   # 3h UTC = 4h/5h Paris
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  trivy-deployed:
    uses: ./.github/workflows/_trivy-image.yml
    with:
      image-ref: ghcr.io/christ-roy/veridian-hub:latest
      severity: 'CRITICAL,HIGH'
      ignore-unfixed: true
      sbom-upload: true
      sarif-upload: true

  # Trivy FS scan hebdo : re-scanne le repo (vuln lockfile + misconfig + secret + license)
  # Détecte les CVE qui sortent APRÈS le dernier merge.
  trivy-fs-weekly:
    uses: ./.github/workflows/_trivy-fs.yml
    with:
      scan-path: '.'
      severity: 'CRITICAL,HIGH'
      ignore-unfixed: true
      skip-license: false
      sarif-upload: true

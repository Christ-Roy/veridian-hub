name: Hub CI/CD

# Repo standalone veridian-hub. Code à la racine (post-extraction monorepo
# veridian-platform le 2026-05-13). Cf README.md.

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - 'todo/**'
      - '_archive/**'
      - 'docs/**'
      - 'runbooks/**'
      - '**/*.md'
      # La batterie système ne part pas dans l'image : la modifier ne doit pas couper la prod.
      - 'e2e/systeme-sso/**'
      - 'scripts/test-systeme-sso.sh'
      - 'scripts/navigateur-distant.sh'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'todo/**'
      - '_archive/**'
      - 'docs/**'
      - 'runbooks/**'
      - '**/*.md'
      # La batterie système ne part pas dans l'image : la modifier ne doit pas couper la prod.
      - 'e2e/systeme-sso/**'
      - 'scripts/test-systeme-sso.sh'
      - 'scripts/navigateur-distant.sh'
  workflow_dispatch:
    inputs:
      # Redéployer le jobspec de main avec une image DÉJÀ servie, sans construire (fiche nomad-veridian 34, piège des CI qui construisent à
      # chaque push) : un changement de tags `traefik.*` seul doit rester une mise à jour EN PLACE, jamais un canari. Ex. : v0.5.252.
      image_existante:
        description: 'Étiquette GHCR déjà publiée à redéployer telle quelle (vide = construire)'
        required: false
        default: ''

# Un push sur main n'annule plus un déploiement lancé (24/11/2026). Sur main, seuls `test` et `docker` d'un run dépassé
# s'annulent (groupes de job, plus bas) : le run dépassé n'atteint donc pas le déploiement, et un run déjà en déploiement
# finit ; le suivant attend derrière lui. Hors main, un push annule le run précédent, comme avant.
concurrency:
  group: hub-ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'unique' }}
  cancel-in-progress: true

# Permissions par défaut au niveau workflow : nécessaire pour que les workflows
# réutilisables (_trivy-fs, _trivy-image) puissent uploader SARIF dans le
# GitHub Security tab via codeql-action/upload-sarif@v4.
# Sans ça, sur pull_request depuis fork le job calling reçoit
# 'security-events: none' et le startup fail.
permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: christ-roy/veridian-hub

jobs:
  test:
    concurrency:
      group: hub-test-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch depth 0 pour que check-test-mapping puisse faire
          # `git diff origin/main...HEAD`. Sinon le diff renvoie tout.
          fetch-depth: 0
          submodules: recursive  # shared/ submodule veridian-infra
          token: ${{ secrets.CR_PAT }}  # PAT cross-repo (veridian-infra privé depuis 2026-07-10)
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts || pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Generate Prisma client (postinstall skipped via --ignore-scripts)
        run: pnpm exec prisma generate
      - name: Test mapping route↔test (anti --no-verify)
        run: ./scripts/ci/check-test-mapping.sh
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
      - name: Atelier /dev — aucune route en extension standard
        # Les ateliers UI doivent rester en `page.dev.tsx` / `route.dev.ts` :
        # ces extensions ne sont déclarées dans `pageExtensions` que hors
        # production, donc la route n'existe pas dans un bundle prod. Un
        # `page.tsx` sous app/dev serait, lui, routé en prod. Le layout
        # `app/dev/layout.tsx` et le middleware rattrapent le coup au runtime,
        # mais on refuse le fichier dès la CI : c'est gratuit et sans faux
        # positif. `app/dev/layout.tsx` est la SEULE exception attendue.
        run: |
          COUPABLES=$(find app/dev \( -name 'page.tsx' -o -name 'route.ts' -o -name 'page.jsx' -o -name 'route.js' \) 2>/dev/null || true)
          if [ -n "$COUPABLES" ]; then
            echo "::error::Route en extension standard sous app/dev (routée en PROD) :"
            echo "$COUPABLES"
            echo "→ renommer en *.dev.tsx / *.dev.ts (cf. lib/dev/harness-guard.ts)"
            exit 1
          fi
          echo "✓ Aucune route d'atelier en extension standard"
      - name: Lint
        run: pnpm lint
      # Ce dépôt est PUBLIC : un secret poussé ici est publié et l'historique
      # le conserve. Bloquant. L'autotest tourne AVANT le contrôle : un garde-fou
      # qu'on n'a jamais vu refuser ne prouve rien (incident 2026-05-21).
      - name: Autotest du détecteur de secrets
        run: ./scripts/ci/check-no-secrets.selftest.sh
      - name: Aucun secret en clair dans les fichiers trackés
        run: ./scripts/ci/check-no-secrets.sh
      - name: Compose sync (base + prod + staging cohérents)
        run: ./scripts/ci/check-compose-sync.sh
      - name: ENV sync (code ↔ .env.example ↔ compose)
        run: ./scripts/ci/check-env-sync.sh
      - name: Migration safety (DROP/RENAME/CREATE INDEX bloquants)
        run: ./scripts/ci/check-migration-safety.sh
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
      - name: GitOps prod reliability invariants
        run: ./scripts/ci/check-prod-gitops-reliability.sh
      - name: Hub HA env contract
        run: ./scripts/ci/check-hub-ha-env-contract.sh
      - name: Tests
        run: pnpm test
        env:
          NODE_ENV: test
      # Sur main, le build est fait par le job docker (même commande), dont le déploiement dépend : pas deux fois.
      - name: Build check
        if: github.ref != 'refs/heads/main'
        run: pnpm build
        env:
          # La vérification des types de Next plafonnait au tas par défaut (2 Go) : OOM le 22/11 et le 23/11 (VER-203), 16 Go sur le runner.
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_fake
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_NOTIFUSE_URL: http://localhost:3002
          NEXT_PUBLIC_NOTIFUSE_API_URL: http://localhost:3003
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_fake

  audit:
    name: CVE audit (high+critical bloquant)
    uses: ./.github/workflows/_audit-cve.yml
    with:
      app-path: .
      package-manager: pnpm
      node-version: "20"
      pnpm-version: "10"
      omit-dev: true

  # Trivy FS scan : vuln + misconfig (Dockerfile, compose) + secret + license
  # Bloquant sur CRIT/HIGH. SARIF uploadé dans GitHub Security tab.
  trivy-fs:
    name: Trivy FS (vuln+config+secret+license)
    uses: ./.github/workflows/_trivy-fs.yml
    with:
      scan-path: '.'
      severity: 'CRITICAL,HIGH'
      ignore-unfixed: true
      skip-license: false
      sarif-upload: true

  # En parallèle des tests : l'image part au registre, mais `deploy-prod` exige test, audit et les deux Trivy verts.
  docker:
    concurrency:
      group: hub-docker-${{ github.ref }}
      cancel-in-progress: true
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # GitHub-hosted depuis extraction polyrepo (2026-05-13). Le self-hosted
    # runner [self-hosted, veridian] n'est pas enregistré sur ce repo.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive  # shared/ submodule veridian-infra
          token: ${{ secrets.CR_PAT }}  # PAT cross-repo (veridian-infra privé depuis 2026-07-10)
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          PACKAGE_NAME="veridian-hub"
          EXISTING_TAGS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/users/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}/versions" \
            --jq '.[].metadata.container.tags[]' 2>/dev/null || echo "")
          LATEST_TAG=$(echo "$EXISTING_TAGS" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV | tail -n 1)
          if [ -n "$REPRISE" ]; then
            # Une étiquette exacte, déjà publiée : sinon rien ne part (jamais un « latest » ni une image construite ici).
            echo "$REPRISE" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::image_existante invalide : $REPRISE"; exit 1; }
            echo "$EXISTING_TAGS" | grep -qx "$REPRISE" || { echo "::error::image_existante absente de GHCR : $REPRISE"; exit 1; }
            echo "version=${REPRISE}" >> $GITHUB_OUTPUT
            echo "reprise=true" >> $GITHUB_OUTPUT
            echo "Image reprise telle quelle : ${REPRISE}"
            exit 0
          fi
          if [ -z "$LATEST_TAG" ]; then
            VERSION="v0.5.0"
          else
            VERSION_WITHOUT_V=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_WITHOUT_V"
            PATCH=$((PATCH + 1))
            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Par l'environnement, jamais interpolée dans le script (injection).
          REPRISE: ${{ github.event.inputs.image_existante }}

      # site.veridian.migrations : lu par veridian-ci-deploy. Même liste que l'image servie = contrôle du PITR (4 s) au lieu
      # d'une sauvegarde ; liste différente ou étiquette absente = sauvegarde avant de déployer.
      # Pas de cache GitHub : essayé le 24/11, son export prenait 8 min pour une image faite en 3 min 40.
      - name: Empreinte des migrations
        id: prep
        run: |
          set -euo pipefail
          MIG="$(ls prisma/migrations | grep -E '^[0-9]' | LC_ALL=C sort)"
          echo "migrations=$(wc -l <<<"$MIG")-$(sha256sum <<<"$MIG" | cut -c1-64)" | tee -a "$GITHUB_OUTPUT"

      - name: Build and push
        id: build1
        if: steps.version.outputs.reprise != 'true'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          provenance: false
          build-args: GIT_SHA=${{ github.sha }}
          labels: site.veridian.migrations=${{ steps.prep.outputs.migrations }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # Échecs passagers du push GHCR (« context deadline exceeded »).
      - name: Build and push (second essai)
        if: steps.build1.outcome == 'failure' && steps.version.outputs.reprise != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          provenance: false
          build-args: GIT_SHA=${{ github.sha }}
          labels: site.veridian.migrations=${{ steps.prep.outputs.migrations }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  trivy:
    needs: docker
    uses: ./.github/workflows/_trivy-image.yml
    with:
      image-ref: ghcr.io/christ-roy/veridian-hub:${{ needs.docker.outputs.version }}
      severity: 'CRITICAL,HIGH'
      ignore-unfixed: true

  # ─── Deploy PROD via GitOps Nomad (SSH bastion) ───
  # Remplace l'ancien deploy Dokploy (décommissionné 2026-07-10). Canon de
  # référence : veridian-prospection/deploy/README.md. Le NOMAD_TOKEN ne quitte
  # JAMAIS le bastion (sourcé in situ). Secrets app = Nomad Variable nomad/jobs/hub.
  #
  # ⚠️ PLUS de job `migrate-prod` : le container Hub migre AU BOOT (Dockerfile CMD
  # `prisma migrate deploy && … && server.js`, CLI isolé dans /opt/prisma-cli,
  # idempotent + advisory lock Postgres). Quand Nomad démarre le nouvel alloc, le
  # migrate-on-boot tourne contre l'endpoint DB rendu par deploy/hub.nomad.hcl
  # (contrat HUB_DATABASE_* ; fallback prod actuel = DB co-localisée) → puis
  # server.js. Un migrate qui échoue = container jamais healthy → l'update stanza
  # `auto_revert = true` du job restaure automatiquement la version saine.
  #
  # ⚠️ PLUS de job `rollback-prod` Dokploy : Nomad `auto_revert` couvre le cas
  # "deploy jamais healthy" ; un échec post-deploy (e2e-prod-smoke rouge sur un
  # alloc healthy) = rollback MANUEL §20 (mot-clé `rollback` = git revert + push
  # main → re-deploy du SHA d'avant + monitoring). Cf deploy/README (canon §7).
  deploy-prod:
    name: Deploy Nomad prod (SSH bastion)
    needs: [test, audit, trivy-fs, docker, trivy]
    # Deux pushes rapprochés : le second attend la fin du premier, il ne l'annule pas.
    concurrency:
      group: hub-deploy-prod
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Un groupe implaçable (rise éteint) laisse le déploiement « running » sans fin, alors que le Hub est déjà promu
    # (éprouvé le 24/11) : sans borne, ce job attendrait 6 h. 45 : la sauvegarde qui précède a pris 10 min ce jour-là.
    timeout-minutes: 45
    # GitHub Environment `production` — tracking centralisé des deploys prod.
    environment:
      name: production
      url: https://app.veridian.site
    env:
      NOMAD_JOB: hub
      JOB_FILE: deploy/hub.nomad.hcl
      PROD_URL: https://app.veridian.site
    steps:
      - uses: actions/checkout@v6
        # Le HCL vit dans le repo (deploy/) — pas besoin du submodule ici.

      - name: Install SSH key (bastion Nomad, clé contrainte V2)
        env:
          DEPLOY_KEY: ${{ secrets.NOMAD_DEPLOY_SSH_KEY_V2 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.NOMAD_BASTION_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ── Verbes contraints (constat C4) ──
      # La clé V2 porte `command="/usr/local/sbin/veridian-ci-deploy hub"` : elle
      # n'ouvre aucun shell, le bastion n'accepte que put-job / plan / deploy /
      # smoke / cleanup / revert (cf. deploy/README.md). Pré-hook (sauvegarde R2
      # prod), pré-pull ghcr, validate, plan, run -check-index et suivi du
      # DeploymentID sont exécutés CÔTÉ BASTION : ne pas les redupliquer ici.
      # ⚠️ On dépose le HCL DU REPO (qui déclare `variable "image_tag"`) sur stdin.
      - name: Put job HCL (verbe put-job)
        # Rangé sous le tag (veridian-ci-deploy, 26/11) : deux exécutions parallèles ne partagent plus le même fichier.
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.version }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "put-job prod ${IMAGE_TAG}" < "$JOB_FILE"

      - name: Deploy (verbe deploy)
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.version }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "deploy prod ${IMAGE_TAG}"

      # Rouge ou bloqué : dire quel groupe, et si le Hub sert quand même la nouvelle version (groupe à part : atelier, programme).
      - name: Groupe en cause
        if: failure() || cancelled()
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "status prod" | bash scripts/ci/groupe-en-cause.sh

      - name: Cleanup remote HCL (verbe cleanup)
        if: always()
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.version }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "cleanup prod ${IMAGE_TAG}" || true

      # Smoke public (le monitor Nomad a déjà garanti que le NOUVEL alloc est
      # healthy ; ce curl est une double-vérif via l'ingress public).
      - name: Smoke /api/health (retry 6x/10s)
        run: |
          for i in $(seq 1 6); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$PROD_URL/api/health" || echo "000")
            echo "[$i/6] /api/health → $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            [ "$i" = "6" ] && { echo "::error::Smoke /api/health failed"; exit 1; }
            sleep 10
          done

      - name: Cleanup local runner
        if: always()
        run: rm -f ~/.ssh/id_ed25519

  e2e-prod-smoke:
    needs: deploy-prod
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04  # 07/11 : ubuntu-latest = 26.04, Playwright refuse d y installer chromium
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive  # shared/ submodule veridian-infra
          token: ${{ secrets.CR_PAT }}  # PAT cross-repo (veridian-infra privé)
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Install Playwright chromium
        # Sans --with-deps (VER-159) : l image du runner embarque deja les dependances systeme, et --with-deps exige sudo.
        run: npx playwright install chromium
      - name: Run prod smoke (Auth.js + /login)
        run: npx playwright test e2e/prod-smoke/ --reporter=list
      # Sonde d'identité : lectures seules, aucune écriture, aucun compte. Un écart fait échouer le
      # job, donc déclenche le rollback comme le reste du smoke. Chaque contrôle est repris 3 fois
      # (coupure de déploiement de 20 à 50 s mesurée le 07/11). Rejeu et épreuve : docs/PARCOURS-IDENTITE.md.
      - name: Sonde identité (rebond, session, en-têtes)
        env:
          HUB_URL: https://app.veridian.site
        run: |
          set -u
          ECHECS=0
          APP='https%3A%2F%2Fprospection.app.veridian.site%2F'
          CLIENT='https%3A%2F%2Fboutique-dupont.veridian.site%2F'
          # verifie <nom> <attendu : motif egrep> <commande qui affiche l'observé>
          verifie() {
            nom="$1"; motif="$2"; shift 2
            for essai in 1 2 3; do
              obs="$("$@" 2>/dev/null | tr -d '\r' | head -c 400)" || true
              if printf '%s' "$obs" | grep -Eqi "$motif"; then echo "OK   $nom"; return 0; fi
              sleep 8
            done
            echo "::error::Sonde identité : $nom. Attendu /$motif/, observé: $obs"
            ECHECS=$((ECHECS+1))
          }
          statut() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$@"; }
          lieu() { curl -s -o /dev/null -D - --max-time 20 "$@" | grep -i '^location:' | head -1; }
          entetes() { curl -s -o /dev/null -D - --max-time 20 "$@"; }
          # La CSP à nonce dépasse les 400 caractères que garde verifie : on extrait la directive elle-même (26/11, sonde aveugle après la CSP bloquante).
          directive() { curl -s -o /dev/null -D - --max-time 20 "$2" | grep -i '^content-security-policy:' | grep -io "$1[^;]*" | head -1; }

          verifie "/login répond 200" '^200$' statut "$HUB_URL/login"
          verifie "/api/auth/session vide sans cookie" '^null$' curl -s --max-time 20 "$HUB_URL/api/auth/session"
          verifie "frame-ancestors présent sur /login (le Hub seul)" "^frame-ancestors 'self'$" directive frame-ancestors "$HUB_URL/login"
          verifie "/ia/chat : encadrable par les apps seulement" "^frame-ancestors 'self' https://\\*\\.app\\.veridian\\.site$" directive frame-ancestors "$HUB_URL/ia/chat"
          verifie "prepare sans session : /login en mode rebond" "location: https://app.veridian.site/login\\?mode=bounce&app=prospection" lieu "$HUB_URL/api/auth/bounce/prepare?auto=1&next=$APP"
          verifie "prepare vers un site client : refusé, /login simple" "location: https://app.veridian.site/login$" lieu "$HUB_URL/api/auth/bounce/prepare?auto=1&next=$CLIENT"
          verifie "prepare vers un hôte étranger : refusé" "location: https://app.veridian.site/login$" lieu "$HUB_URL/api/auth/bounce/prepare?auto=1&next=https%3A%2F%2Fevil.example%2F"
          verifie "complete dans une iframe : 204 sans rien émettre" '^204$' statut -H 'Sec-Fetch-Dest: iframe' -H 'Sec-Fetch-Mode: navigate' "$HUB_URL/api/auth/bounce/complete"
          verifie "prepare dans une iframe : 204 sans cookie" '^204$' statut -H 'Sec-Fetch-Dest: iframe' -H 'Sec-Fetch-Mode: navigate' "$HUB_URL/api/auth/bounce/prepare?auto=1&next=$APP"
          [ "$ECHECS" -eq 0 ] || { echo "::error::$ECHECS contrôle(s) d'identité en échec"; exit 1; }
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hub-prod-smoke-trace
          path: test-results/
          retention-days: 7

name: Hub CI/CD

# Repo standalone veridian-hub. Code à la racine (post-extraction monorepo
# veridian-platform le 2026-05-13). Cf README.md.

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - 'todo/**'
      - '_archive/**'
      - 'docs/**'
      - 'runbooks/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'todo/**'
      - '_archive/**'
      - 'docs/**'
      - 'runbooks/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

# Permissions par défaut au niveau workflow : nécessaire pour que les workflows
# réutilisables (_trivy-fs, _trivy-image) puissent uploader SARIF dans le
# GitHub Security tab via codeql-action/upload-sarif@v3.
# Sans ça, sur pull_request depuis fork le job calling reçoit
# 'security-events: none' et le startup fail.
permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: christ-roy/veridian-hub

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch depth 0 pour que check-test-mapping puisse faire
          # `git diff origin/main...HEAD`. Sinon le diff renvoie tout.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts || pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Generate Prisma client (postinstall skipped via --ignore-scripts)
        run: pnpm exec prisma generate
      - name: Test mapping route↔test (anti --no-verify)
        run: ./scripts/ci/check-test-mapping.sh
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
      - name: Lint
        run: pnpm lint
      - name: Compose sync (base + prod + staging cohérents)
        run: ./scripts/ci/check-compose-sync.sh
      - name: ENV sync (code ↔ .env.example ↔ compose)
        run: ./scripts/ci/check-env-sync.sh
      - name: Migration safety (DROP/RENAME/CREATE INDEX bloquants)
        run: ./scripts/ci/check-migration-safety.sh
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
      - name: Tests
        run: pnpm test
        env:
          NODE_ENV: test
      - name: Build check
        run: pnpm build
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_fake
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_NOTIFUSE_URL: http://localhost:3002
          NEXT_PUBLIC_NOTIFUSE_API_URL: http://localhost:3003
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_fake

  audit:
    name: CVE audit (high+critical bloquant)
    uses: ./.github/workflows/_audit-cve.yml
    with:
      app-path: .
      package-manager: pnpm
      node-version: "20"
      pnpm-version: "10"
      omit-dev: true

  # Trivy FS scan : vuln + misconfig (Dockerfile, compose) + secret + license
  # Bloquant sur CRIT/HIGH. SARIF uploadé dans GitHub Security tab.
  trivy-fs:
    name: Trivy FS (vuln+config+secret+license)
    uses: ./.github/workflows/_trivy-fs.yml
    with:
      scan-path: '.'
      severity: 'CRITICAL,HIGH'
      ignore-unfixed: true
      skip-license: false
      sarif-upload: true

  # Path-based staging gate : si la PR/push touche aux fichiers structurels
  # (Dockerfile, prisma/schema.prisma, prisma/migrations/**, compose/**,
  # docker-compose.yml, package.json, pnpm-lock.yaml) → exige un run staging
  # vert dans les 24h sur un ancêtre de HEAD.
  # N'exécute la vérification staging que sur push main (sur PR, on bloque pas).
  structural-gate:
    name: Structural change gate (staging fresh)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      has-structural: ${{ steps.detect.outputs.has-structural }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - name: Detect structural changes
        id: detect
        run: ./scripts/ci/check-structural-changes.sh || true
        env:
          BASE_REF: HEAD~1
      - name: Require staging fresh
        if: steps.detect.outputs.has-structural == 'true'
        run: ./scripts/ci/check-staging-fresh.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: [test, audit, trivy-fs, structural-gate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # GitHub-hosted depuis extraction polyrepo (2026-05-13). Le self-hosted
    # runner [self-hosted, veridian] n'est pas enregistré sur ce repo.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          PACKAGE_NAME="veridian-hub"
          EXISTING_TAGS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/users/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}/versions" \
            --jq '.[].metadata.container.tags[]' 2>/dev/null || echo "")
          LATEST_TAG=$(echo "$EXISTING_TAGS" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION="v0.5.0"
          else
            VERSION_WITHOUT_V=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_WITHOUT_V"
            PATCH=$((PATCH + 1))
            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Wrapper retry pour palier les "context deadline exceeded / no active
      # session" intermittents du push GHCR depuis self-hosted runner.
      - name: Build and push (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          command: |
            docker buildx build \
              --target runner \
              --push \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              -f ./Dockerfile \
              .

  trivy:
    needs: docker
    uses: ./.github/workflows/_trivy-image.yml
    with:
      image-ref: ghcr.io/christ-roy/veridian-hub:latest
      severity: 'CRITICAL,HIGH'
      ignore-unfixed: true

  # ─── Prisma migrate deploy AVANT deploy-prod ───
  # Le Dockerfile runner (standalone Next.js) n'embarque ni `pnpm` ni le
  # CLI Prisma, donc on ne peut pas lancer `prisma migrate deploy` au boot
  # du container Hub sans alourdir l'image + risquer un fail boot (DB lag).
  # À la place : container éphémère `node:22-alpine` sur le network
  # `dokploy-network` qui résout `veridian-core-db:5432` et applique les
  # migrations idempotentes (exit 0 si DB déjà à jour).
  #
  # Doit tourner AVANT deploy-prod : ainsi quand le nouveau code prod
  # démarre, sa DB matche déjà son schema.prisma. Si la migration fail
  # (constraint conflict, etc.) → deploy-prod ne tourne pas (dependency)
  # → la prod actuelle reste en place → pas de breaking change.
  #
  # Pattern documenté dans memory `reference_hub_prod_no_auto_migrate.md`
  # (section "Comment migrer manuellement Hub staging").
  migrate-prod:
    needs: [docker, trivy]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Apply Prisma migrations on prod DB
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ] || [ -z "$VPS_HOST" ]; then
            echo "::warning::Prod migrate skipped (no SSH credentials configured)"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # 1) Bundle prisma/ + package.json + pnpm-lock + prisma.config.ts
          tar -czf /tmp/prisma-migrate.tar.gz prisma/ package.json pnpm-lock.yaml prisma.config.ts

          # 2) Upload + extract sur prod-pub
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/prisma-migrate.tar.gz "$VPS_USER@$VPS_HOST:/tmp/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            'rm -rf /tmp/hub-prisma-migrate && mkdir -p /tmp/hub-prisma-migrate && tar -xzf /tmp/prisma-migrate.tar.gz -C /tmp/hub-prisma-migrate'

          # 3) Run prisma migrate deploy dans un container éphémère sur le
          #    réseau dokploy-network (où vit veridian-core-db). Récupère
          #    DATABASE_URL depuis le container Hub prod en cours (le
          #    password n'est PAS dans ~/credentials/.all-creds.env mais
          #    bien dans l'ENV du container Hub injectée par Dokploy).
          #    `prisma migrate deploy` est idempotent : exit 0 si à jour,
          #    applique séquentiellement les pending migrations sinon.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash <<'REMOTE'
          set -euo pipefail

          # Récupération du DATABASE_URL depuis le container Hub prod
          # (Dokploy injecte l'ENV à partir de la config compose). Pattern
          # robuste : aucun couplage avec ~/credentials/.all-creds.env.
          HUB_CONTAINER=$(docker ps --filter 'name=hub' --filter 'status=running' --format '{{.Names}}' | grep -E 'compose-back-up-online-pixel.*-hub-' | head -1)
          if [ -z "$HUB_CONTAINER" ]; then
            echo "ERROR: container Hub prod introuvable (filter compose-back-up-online-pixel.*-hub-)"
            docker ps --format '{{.Names}}' | head -20
            exit 1
          fi
          echo "Hub container: $HUB_CONTAINER"

          DB_URL=$(docker exec "$HUB_CONTAINER" env | grep '^DATABASE_URL=' | head -1 | cut -d= -f2-)
          if [ -z "$DB_URL" ]; then
            echo "ERROR: DATABASE_URL not found in $HUB_CONTAINER env"
            exit 1
          fi
          echo "DATABASE_URL resolved (length=${#DB_URL})"

          echo "Running prisma migrate deploy on veridian-core-db (hub_app schema)..."
          docker run --rm \
            --network dokploy-network \
            -v /tmp/hub-prisma-migrate:/app \
            -w /app \
            -e DATABASE_URL="$DB_URL" \
            -e DEBUG="prisma:migrate*" \
            node:22-alpine \
            sh -c '
              corepack enable >/dev/null 2>&1 && \
              corepack prepare pnpm@10.33.0 --activate >/dev/null 2>&1 && \
              pnpm install --frozen-lockfile --ignore-scripts >/dev/null 2>&1 && \
              pnpm exec prisma migrate deploy
            '
          echo "✓ Prisma migrations applied (or already up to date)"

          # Cleanup — best-effort. Les fichiers dans node_modules ont été
          # créés par root via docker run, donc l'user ubuntu ne peut pas
          # les supprimer. On utilise un container alpine éphémère qui a
          # les droits root pour faire le ménage.
          docker run --rm -v /tmp/hub-prisma-migrate:/cleanup alpine \
            sh -c 'rm -rf /cleanup/* /cleanup/.[!.]*' 2>/dev/null || true
          rm -rf /tmp/hub-prisma-migrate /tmp/prisma-migrate.tar.gz 2>/dev/null || true
          REMOTE

      - name: Cleanup runner secrets
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts /tmp/prisma-migrate.tar.gz

  deploy-prod:
    needs: [docker, trivy, migrate-prod]
    runs-on: ubuntu-latest
    # GitHub Environment `production` — permet :
    # - Tracking centralisé des deploys (Settings → Environments → production)
    # - Ajout futur de protection rules (manual approval si changement structurel)
    # - Scoping des secrets prod (DEPLOY_SSH_KEY, VPS_HOST, etc. à scope env)
    environment:
      name: production
      url: https://app.veridian.site
    steps:
      - name: Trigger Dokploy redeploy (custom-git mode pulls main automatically)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$VPS_HOST" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "Prod deploy not fully configured — skipping (set vars/secrets)"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST bash -s << DEPLOY
            CURRENT_ID=\$(docker images ghcr.io/christ-roy/veridian-hub:latest --format '{{.ID}}' 2>/dev/null)
            if [ -n "\$CURRENT_ID" ]; then
              docker tag "\$CURRENT_ID" ghcr.io/christ-roy/veridian-hub:rollback
              echo "Tagged current image as :rollback (\$CURRENT_ID)"
            fi
            docker pull ghcr.io/christ-roy/veridian-hub:latest
            DKEY=\$(grep '^DOKPLOY_API_KEY=' ~/credentials/.all-creds.env | cut -d= -f2)
            # compose.deploy clone Git puis up. compose.redeploy juste up sans
            # re-clone => le compose Git ne se met jamais à jour. Pour GitOps
            # custom-git il faut compose.deploy.
            curl -sf -X POST \
              -H "x-api-key: \$DKEY" \
              -H "Content-Type: application/json" \
              -d '{"json":{"composeId":"$DOKPLOY_COMPOSE_ID"}}' \
              http://localhost:3000/api/trpc/compose.deploy && echo "Hub prod deploy triggered"
          DEPLOY
          echo "Waiting for hub health (up to 2min)..."
          for i in $(seq 1 12); do
            if curl -sf https://app.veridian.site/api/health | grep -q '"status":"ok"'; then
              echo "Hub prod healthy after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: hub health check failed after 2min — deploy probably broken"
          exit 1

      - name: Cleanup runner secrets
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts

  e2e-prod-smoke:
    needs: deploy-prod
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run prod smoke (Auth.js + /login)
        run: npx playwright test e2e/prod-smoke/ --reporter=list
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hub-prod-smoke-trace
          path: test-results/
          retention-days: 7

  # Rollback : déclenché uniquement si deploy-prod OU e2e-prod-smoke a explicitement
  # fail (pas si skipped). Évite le faux rollback quand Trivy bloque le deploy.
  rollback-prod:
    needs: [deploy-prod, e2e-prod-smoke]
    if: |
      github.ref == 'refs/heads/main' &&
      (needs.deploy-prod.result == 'failure' || needs.e2e-prod-smoke.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Rollback to previous image
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$VPS_HOST" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "Rollback skipped (no prod credentials)"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST bash -s << ROLLBACK
            ROLLBACK_ID=\$(docker images ghcr.io/christ-roy/veridian-hub:rollback --format '{{.ID}}' 2>/dev/null)
            if [ -z "\$ROLLBACK_ID" ]; then
              echo "No :rollback image found — cannot rollback"
              exit 1
            fi
            docker tag ghcr.io/christ-roy/veridian-hub:rollback ghcr.io/christ-roy/veridian-hub:latest
            DKEY=\$(grep '^DOKPLOY_API_KEY=' ~/credentials/.all-creds.env | cut -d= -f2)
            curl -sf -X POST \
              -H "x-api-key: \$DKEY" \
              -H "Content-Type: application/json" \
              -d '{"json":{"composeId":"$DOKPLOY_COMPOSE_ID"}}' \
              http://localhost:3000/api/trpc/compose.redeploy
            echo "Rolled back to previous image"
          ROLLBACK
          for i in $(seq 1 9); do
            if curl -sf https://app.veridian.site/api/health | grep -q '"status":"ok"'; then
              echo "Rollback healthy after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "WARNING: rollback health check timed out — manual intervention needed"
          exit 1

      - name: Cleanup runner secrets
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts

name: Hub CI/CD

# Repo standalone veridian-hub. Code à la racine (post-extraction monorepo
# veridian-platform le 2026-05-13). Cf README.md.

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - 'todo/**'
      - '_archive/**'
      - 'docs/**'
      - 'runbooks/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'todo/**'
      - '_archive/**'
      - 'docs/**'
      - 'runbooks/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

# Permissions par défaut au niveau workflow : nécessaire pour que les workflows
# réutilisables (_trivy-fs, _trivy-image) puissent uploader SARIF dans le
# GitHub Security tab via codeql-action/upload-sarif@v4.
# Sans ça, sur pull_request depuis fork le job calling reçoit
# 'security-events: none' et le startup fail.
permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: christ-roy/veridian-hub

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch depth 0 pour que check-test-mapping puisse faire
          # `git diff origin/main...HEAD`. Sinon le diff renvoie tout.
          fetch-depth: 0
          submodules: recursive  # shared/ submodule veridian-infra
          token: ${{ secrets.CR_PAT }}  # PAT cross-repo (veridian-infra privé depuis 2026-07-10)
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts || pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Generate Prisma client (postinstall skipped via --ignore-scripts)
        run: pnpm exec prisma generate
      - name: Test mapping route↔test (anti --no-verify)
        run: ./scripts/ci/check-test-mapping.sh
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
      - name: Lint
        run: pnpm lint
      - name: Compose sync (base + prod + staging cohérents)
        run: ./scripts/ci/check-compose-sync.sh
      - name: ENV sync (code ↔ .env.example ↔ compose)
        run: ./scripts/ci/check-env-sync.sh
      - name: Migration safety (DROP/RENAME/CREATE INDEX bloquants)
        run: ./scripts/ci/check-migration-safety.sh
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
      - name: GitOps prod reliability invariants
        run: ./scripts/ci/check-prod-gitops-reliability.sh
      - name: Tests
        run: pnpm test
        env:
          NODE_ENV: test
      - name: Build check
        run: pnpm build
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_fake
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_NOTIFUSE_URL: http://localhost:3002
          NEXT_PUBLIC_NOTIFUSE_API_URL: http://localhost:3003
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_fake

  audit:
    name: CVE audit (high+critical bloquant)
    uses: ./.github/workflows/_audit-cve.yml
    with:
      app-path: .
      package-manager: pnpm
      node-version: "20"
      pnpm-version: "10"
      omit-dev: true

  # Trivy FS scan : vuln + misconfig (Dockerfile, compose) + secret + license
  # Bloquant sur CRIT/HIGH. SARIF uploadé dans GitHub Security tab.
  trivy-fs:
    name: Trivy FS (vuln+config+secret+license)
    uses: ./.github/workflows/_trivy-fs.yml
    with:
      scan-path: '.'
      severity: 'CRITICAL,HIGH'
      ignore-unfixed: true
      skip-license: false
      sarif-upload: true

  # Path-based staging gate : si la PR/push touche aux fichiers structurels
  # (Dockerfile, prisma/schema.prisma, prisma/migrations/**, compose/**,
  # docker-compose.yml, package.json, pnpm-lock.yaml) → exige un run staging
  # vert dans les 24h sur un ancêtre de HEAD.
  # N'exécute la vérification staging que sur push main (sur PR, on bloque pas).
  structural-gate:
    name: Structural change gate (staging fresh)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      has-structural: ${{ steps.detect.outputs.has-structural }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - name: Detect structural changes
        id: detect
        run: ./scripts/ci/check-structural-changes.sh || true
        env:
          BASE_REF: HEAD~1
      - name: Require staging fresh
        if: steps.detect.outputs.has-structural == 'true'
        run: ./scripts/ci/check-staging-fresh.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: [test, audit, trivy-fs, structural-gate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # GitHub-hosted depuis extraction polyrepo (2026-05-13). Le self-hosted
    # runner [self-hosted, veridian] n'est pas enregistré sur ce repo.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive  # shared/ submodule veridian-infra
          token: ${{ secrets.CR_PAT }}  # PAT cross-repo (veridian-infra privé depuis 2026-07-10)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          PACKAGE_NAME="veridian-hub"
          EXISTING_TAGS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/users/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}/versions" \
            --jq '.[].metadata.container.tags[]' 2>/dev/null || echo "")
          LATEST_TAG=$(echo "$EXISTING_TAGS" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION="v0.5.0"
          else
            VERSION_WITHOUT_V=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_WITHOUT_V"
            PATCH=$((PATCH + 1))
            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Wrapper retry pour palier les "context deadline exceeded / no active
      # session" intermittents du push GHCR depuis self-hosted runner.
      - name: Build and push (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          command: |
            docker buildx build \
              --target runner \
              --push \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              -f ./Dockerfile \
              .

  trivy:
    needs: docker
    uses: ./.github/workflows/_trivy-image.yml
    with:
      image-ref: ghcr.io/christ-roy/veridian-hub:latest
      severity: 'CRITICAL,HIGH'
      ignore-unfixed: true

  # ─── Deploy PROD via GitOps Nomad (SSH bastion) ───
  # Remplace l'ancien deploy Dokploy (décommissionné 2026-07-10). Canon de
  # référence : veridian-prospection/deploy/README.md. Le NOMAD_TOKEN ne quitte
  # JAMAIS le bastion (sourcé in situ). Secrets app = Nomad Variable nomad/jobs/hub.
  #
  # ⚠️ PLUS de job `migrate-prod` : le container Hub migre AU BOOT (Dockerfile CMD
  # `prisma migrate deploy && … && server.js`, CLI isolé dans /opt/prisma-cli,
  # idempotent + advisory lock Postgres). Quand Nomad démarre le nouvel alloc, le
  # migrate-on-boot tourne contre veridian-core-db (127.0.0.1:5432, schema hub_app)
  # → puis server.js. Un migrate qui échoue = container jamais healthy → l'update
  # stanza `auto_revert = true` du job restaure automatiquement la version saine.
  #
  # ⚠️ PLUS de job `rollback-prod` Dokploy : Nomad `auto_revert` couvre le cas
  # "deploy jamais healthy" ; un échec post-deploy (e2e-prod-smoke rouge sur un
  # alloc healthy) = rollback MANUEL §20 (mot-clé `rollback` = git revert + push
  # main → re-deploy du SHA d'avant + monitoring). Cf deploy/README (canon §7).
  deploy-prod:
    name: Deploy Nomad prod (SSH bastion)
    needs: [docker, trivy]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # GitHub Environment `production` — tracking centralisé des deploys prod.
    environment:
      name: production
      url: https://app.veridian.site
    env:
      NOMAD_JOB: hub
      JOB_FILE: deploy/hub.nomad.hcl
      REMOTE_HCL: /tmp/hub-${{ github.run_id }}.nomad.hcl
      PROD_URL: https://app.veridian.site
    steps:
      - uses: actions/checkout@v6
        # Le HCL vit dans le repo (deploy/) — pas besoin du submodule ici.

      - name: Install SSH key (bastion Nomad)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NOMAD_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.NOMAD_BASTION_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ⚠️ On copie le HCL DU REPO (qui déclare `variable "image_tag"`), jamais la
      # copie bastion ~/nomad-veridian/jobs/ (plus vieille, sans le bloc variable).
      - name: Copy HCL to bastion
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "$JOB_FILE" \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}:$REMOTE_HCL"

      - name: nomad job plan (dry-run) + run -detach
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.version }}
          REMOTE_HCL: ${{ env.REMOTE_HCL }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "IMAGE_TAG='${IMAGE_TAG}' REMOTE_HCL='${REMOTE_HCL}' bash -s" <<'REMOTE'
          set -euo pipefail
          # NOMAD_MGMT_TOKEN sourcé ici, sur le bastion, exporté en NOMAD_TOKEN.
          source ~/credentials/nomad-bastion.env
          export NOMAD_ADDR NOMAD_TOKEN="$NOMAD_MGMT_TOKEN"

          echo "== nomad job validate =="
          /usr/bin/nomad job validate -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL"

          echo "== nomad job plan (diff, inoffensif) =="
          set +e
          PLAN_OUTPUT=$(/usr/bin/nomad job plan -no-color \
            -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL" 2>&1)
          PLAN_STATUS=$?
          set -e
          printf '%s\n' "$PLAN_OUTPUT"
          case "$PLAN_STATUS" in
            0) echo "plan sans création ou destruction d'allocation" ;;
            1) echo "plan avec remplacement d'allocation attendu" ;;
            *) echo "::error::nomad job plan a échoué (code=$PLAN_STATUS)"; exit "$PLAN_STATUS" ;;
          esac

          # Lie le run au Modify Index observé par le plan. Si un autre acteur
          # modifie le job entre les deux, Nomad refuse le run au lieu d'écraser
          # silencieusement ce changement concurrent.
          MODIFY_INDEX=$(printf '%s\n' "$PLAN_OUTPUT" \
            | sed -n 's/^Job Modify Index: \([0-9][0-9]*\)$/\1/p' | tail -1)
          RUN_INDEX_ARGS=()
          [ -n "$MODIFY_INDEX" ] && RUN_INDEX_ARGS=(-check-index "$MODIFY_INDEX")

          # Le groupe est stateful et redémarre PostgreSQL. Le runner canonique
          # crée et vérifie une sauvegarde R2 des six bases avant toute mutation.
          echo "== sauvegarde PostgreSQL pré-déploiement vers R2 =="
          /home/brunon5/all-cron/backups/prod-r2-backup.sh

          # ── PRÉ-PULL authentifié sur le nœud cible (prod = ovh-prod) ──
          # Nomad ne pull pas les images PRIVÉES ghcr (plugin sans bloc auth → 401,
          # alloc pending jusqu'au healthy_deadline). On pré-pull via SSH sur le
          # nœud cible (auth ghcr en place) → image déjà présente quand la task démarre.
          echo "== pré-pull image prod sur ovh-prod =="
          ssh -n -o BatchMode=yes -o StrictHostKeyChecking=accept-new prod-pub \
            "docker pull 'ghcr.io/christ-roy/veridian-hub:${IMAGE_TAG}'"

          # Déploiement + vérification CIBLÉE (ni race, ni 404) : run -detach →
          # résout le Deployment de cet eval → `deployment status -monitor <id>`
          # (bloque jusqu'à terminal, exit ≠0 si échec/auto-revert). Évite le faux
          # positif du poll (lit l'ancien deploy) ET le faux négatif du `job run`
          # bloquant (404 transitoire). Incident 2026-07-11.
          # ⚠️ Job prod STATEFUL (DB co-localisée, count=1) → un run recrée l'alloc
          # (bref redémarrage DB, attendu, pas zéro-downtime).
          echo "== nomad job run -detach + monitoring du déploiement ciblé (image_tag=${IMAGE_TAG}) =="
          EVAL=$(/usr/bin/nomad job run -detach "${RUN_INDEX_ARGS[@]}" \
            -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL" \
            | grep -oP 'Evaluation ID:\s+\K\S+')
          echo "eval: ${EVAL:-none}"
          DEP=""
          for i in $(seq 1 15); do
            DEP=$(/usr/bin/nomad eval status -json "$EVAL" 2>/dev/null | python3 -c 'import sys,json;print(json.load(sys.stdin).get("DeploymentID") or "")' 2>/dev/null || true)
            [ -n "$DEP" ] && break
            sleep 2
          done
          if [ -z "$DEP" ]; then
            echo "Pas de déploiement créé (job inchangé = no-op) → OK"
          else
            echo "deployment: $DEP — monitoring jusqu'à terminal…"
            /usr/bin/nomad deployment status -monitor "$DEP"
          fi
          REMOTE

      - name: Cleanup remote HCL
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "rm -f '$REMOTE_HCL'" || true

      # Smoke public (le monitor Nomad a déjà garanti que le NOUVEL alloc est
      # healthy ; ce curl est une double-vérif via l'ingress public).
      - name: Smoke /api/health (retry 6x/10s)
        run: |
          for i in $(seq 1 6); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$PROD_URL/api/health" || echo "000")
            echo "[$i/6] /api/health → $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            [ "$i" = "6" ] && { echo "::error::Smoke /api/health failed"; exit 1; }
            sleep 10
          done

      - name: Cleanup local runner
        if: always()
        run: rm -f ~/.ssh/id_ed25519

  e2e-prod-smoke:
    needs: deploy-prod
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive  # shared/ submodule veridian-infra
          token: ${{ secrets.CR_PAT }}  # PAT cross-repo (veridian-infra privé)
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run prod smoke (Auth.js + /login)
        run: npx playwright test e2e/prod-smoke/ --reporter=list
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hub-prod-smoke-trace
          path: test-results/
          retention-days: 7

name: Hub Staging (dev server)

# Convention officielle Veridian (CLAUDE.md racine §Staging) :
#   - 1 stack staging fixe sur hub.staging.veridian.site
#   - Trigger : push sur branche `staging`
#   - Pas d'éphémère par PR, pas de teardown auto
#   - Deploy GITOPS NOMAD via SSH bastion (canon Prospection deploy/README.md).
#     L'ancien deploy compose Dokploy dev-pub est retiré (migration Nomad 2026-07).
#
# Pour valider une PR sur staging avant merge main :
#   1. Push la branche feature/fix → travailler dessus
#   2. Une fois prête, merger (ou cherry-pick) dans `staging`
#   3. Ce workflow se déclenche → deploy automatique
#   4. Smoke + validation manuelle sur https://hub.staging.veridian.site
#   5. Si OK → PR de feature → main → prod

on:
  push:
    branches: [staging]
    paths-ignore:
      - 'todo/**'
      - '_archive/**'
      - 'docs/**'
      - 'runbooks/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: hub-staging-deploy
  cancel-in-progress: false  # un deploy Nomad en cours ne doit pas être interrompu

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: christ-roy/veridian-hub
  STAGING_URL: https://hub.staging.veridian.site

jobs:
  deploy:
    name: Build + deploy Nomad staging (SSH bastion)
    runs-on: ubuntu-latest
    # GitHub Environment `staging` — tracking centralisé des deploys staging.
    environment:
      name: staging
      url: https://hub.staging.veridian.site
    permissions:
      contents: read
      packages: write
    env:
      # Job Nomad staging (== `job "hub-staging"` du HCL) — placé sur ovh-dev.
      NOMAD_JOB: hub-staging
      JOB_FILE: deploy/hub-staging.nomad.hcl
      REMOTE_HCL: /tmp/hub-staging-${{ github.run_id }}.nomad.hcl
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.CR_PAT }}  # PAT cross-repo (veridian-infra privé depuis 2026-07-10)

      - name: Compute image tag
        id: tag
        run: |
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image-tag=staging-$SHA7" >> $GITHUB_OUTPUT
          echo "Building staging-$SHA7"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          command: |
            docker buildx build \
              --target runner \
              --push \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image-tag }} \
              -f ./Dockerfile \
              .

      # ── DEPLOY NOMAD (SSH bastion) — remplace l'ancien deploy compose dev-pub ──
      # Canon : veridian-prospection/deploy/README.md. Le NOMAD_TOKEN ne quitte
      # JAMAIS le bastion (sourcé in situ). Les secrets app vivent dans la Nomad
      # Variable nomad/jobs/hub-staging (injectés cluster-side par template{env}).
      # ⚠️ Adaptation Hub : PAS de step `prisma migrate deploy` — le container Hub
      # migre AU BOOT (Dockerfile CMD : `prisma migrate deploy && … && server.js`,
      # idempotent + advisory lock). Nomad démarre le nouvel alloc → migrate-on-boot
      # tourne contre le leader Patroni (via le sidecar HAProxy) → puis server.
      - name: Install SSH key (bastion Nomad)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NOMAD_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.NOMAD_BASTION_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ⚠️ On copie le HCL DU REPO (qui déclare `variable "image_tag"`), jamais la
      # copie bastion ~/nomad-veridian/jobs/ (plus vieille, sans le bloc variable).
      - name: Copy HCL to bastion
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "$JOB_FILE" \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}:$REMOTE_HCL"

      - name: nomad job plan (dry-run) + run -detach
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image-tag }}
          REMOTE_HCL: ${{ env.REMOTE_HCL }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "IMAGE_TAG='${IMAGE_TAG}' REMOTE_HCL='${REMOTE_HCL}' bash -s" <<'REMOTE'
          set -euo pipefail
          # NOMAD_MGMT_TOKEN sourcé ici, sur le bastion, exporté en NOMAD_TOKEN.
          source ~/credentials/nomad-bastion.env
          export NOMAD_ADDR NOMAD_TOKEN="$NOMAD_MGMT_TOKEN"

          # ── PRÉ-PULL authentifié sur le nœud cible (staging = ovh-dev == dev-pub) ──
          # Nomad ne pull pas les images PRIVÉES ghcr (plugin sans bloc auth → 401,
          # alloc pending jusqu'au healthy_deadline, incident 2026-07-11). On pré-pull
          # AVEC l'auth ghcr du nœud. -n IMPÉRATIF : sinon ce ssh avale le stdin du
          # heredoc REMOTE et mange les commandes nomad suivantes → faux vert.
          echo "== pré-pull image sur ovh-dev (auth ghcr du nœud) =="
          ssh -n -o BatchMode=yes -o ConnectTimeout=15 dev-pub \
            "docker pull ghcr.io/christ-roy/veridian-hub:${IMAGE_TAG}"

          echo "== nomad job validate =="
          /usr/bin/nomad job validate -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL"

          echo "== nomad job plan (diff, inoffensif) =="
          set +e
          PLAN_OUTPUT=$(/usr/bin/nomad job plan -no-color \
            -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL" 2>&1)
          PLAN_STATUS=$?
          set -e
          printf '%s\n' "$PLAN_OUTPUT"
          case "$PLAN_STATUS" in
            0) echo "plan sans création ou destruction d'allocation" ;;
            1) echo "plan avec remplacement d'allocation attendu" ;;
            *) echo "::error::nomad job plan staging a échoué (code=$PLAN_STATUS)"; exit "$PLAN_STATUS" ;;
          esac

          # Refuse d'écraser une modification concurrente entre plan et run.
          MODIFY_INDEX=$(printf '%s\n' "$PLAN_OUTPUT" \
            | sed -n 's/^Job Modify Index: \([0-9][0-9]*\)$/\1/p' | tail -1)
          RUN_INDEX_ARGS=()
          [ -n "$MODIFY_INDEX" ] && RUN_INDEX_ARGS=(-check-index "$MODIFY_INDEX")

          # Déploiement + vérification CIBLÉE (ni race, ni 404) : run -detach →
          # résout le Deployment de cet eval → `deployment status -monitor <id>`
          # (bloque jusqu'à terminal, exit ≠0 si échec/auto-revert). Évite le faux
          # positif du poll `job status | grep successful` (lit l'ancien deploy) ET
          # le faux négatif du `job run` bloquant (404 transitoire). Incident 2026-07-11.
          echo "== nomad job run -detach + monitoring du déploiement ciblé (image_tag=${IMAGE_TAG}) =="
          EVAL=$(/usr/bin/nomad job run -detach "${RUN_INDEX_ARGS[@]}" \
            -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL" \
            | grep -oP 'Evaluation ID:\s+\K\S+')
          echo "eval: ${EVAL:-none}"
          DEP=""
          for i in $(seq 1 15); do
            DEP=$(/usr/bin/nomad eval status -json "$EVAL" 2>/dev/null | python3 -c 'import sys,json;print(json.load(sys.stdin).get("DeploymentID") or "")' 2>/dev/null || true)
            [ -n "$DEP" ] && break
            sleep 2
          done
          if [ -z "$DEP" ]; then
            echo "Pas de déploiement créé (job inchangé = no-op) → OK"
          else
            echo "deployment: $DEP — monitoring jusqu'à terminal…"
            /usr/bin/nomad deployment status -monitor "$DEP"
          fi
          REMOTE

      - name: Cleanup remote HCL
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "rm -f '$REMOTE_HCL'" || true

      # Staging accessible UNIQUEMENT via le tailnet Veridian (internal-only@nomad,
      # ipAllowList 100.64/10 → 403 hors tailnet). Le runner rejoint le tailnet.
      - name: Tailscale (connect runner to tailnet for staging smoke)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-github
          version: latest

      - name: Smoke test staging URL
        run: |
          echo "Smoke test: ${{ env.STAGING_URL }}/api/health (via Tailscale)"
          for i in $(seq 1 12); do
            if curl -sf --max-time 10 "${{ env.STAGING_URL }}/api/health" | grep -q '"status":"ok"'; then
              echo "✓ Staging healthy: ${{ env.STAGING_URL }}"
              exit 0
            fi
            echo "Attempt $i: not ready, retry in 10s..."
            sleep 10
          done
          echo "::error::Smoke failed after 120s on ${{ env.STAGING_URL }}"
          exit 1

      - name: Cleanup local runner
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519

  # Auto-promote staging → main — UNIQUEMENT pour les commits tier 🟢 BAS.
  # Cf. CI-ARCHITECTURE.md §20 "Promotion graduée par risque" (2026-05-20).
  #
  # Hub est désormais classifié 🔴 Critique (SSO central + billing + provisioning).
  # L'auto-promote ne déclenche QUE si le commit porte explicitement le marker
  # `[risk:low]` dans son message — pour les docs, todo, tests sans modif source,
  # et autres changements sans impact applicatif.
  #
  # Pour tout autre commit (tier 🟡 MOYEN / 🔴 HAUT / 💀 CRITIQUE) :
  #   1. CI staging s'exécute normalement (build + deploy + smoke).
  #   2. Ce job ne fire pas.
  #   3. Le job `notify-promotion-needed` ci-dessous alerte Robert via Telegram
  #      qu'une reco écrite agent est attendue avant promote main.
  #   4. L'agent produit la reco selon le protocole §20.5/20.6/20.7.
  #   5. Robert répond `go` / `stop` ; sur `go` l'agent fait la promotion
  #      manuelle (ff-merge + push main + trigger hub-ci.yml).
  #
  # Garde-fous conservés :
  #   - needs: deploy → si build ou smoke staging KO, pas de promotion
  #   - merge --ff-only strict → fail si main a divergé (pas de force-push)
  #   - marker `[risk:low]` est vérifié côté pre-push hook par check-risk-marker.sh
  #     (refuse les commits qui claim [risk:low] mais touchent un chemin tier 🔴+)
  #
  # Pré-requis inchangés :
  #   - Secret repo AUTO_PROMOTE_PAT (PAT scope `repo` + `workflow`) si la
  #     branche main est protégée par branch protection avec status checks ;
  #     sinon GITHUB_TOKEN suffit.
  promote-to-main:
    name: Auto-promote staging → main (🟢 risk:low only)
    needs: deploy
    runs-on: ubuntu-latest
    # Marker `[risk:low]` doit être dans le subject (1ère ligne) du commit.
    # GitHub Actions n'a pas de fonction "split first line" sur head_commit.message,
    # donc on utilise un step préalable côté shell. Le `if:` ci-dessous ne fait
    # qu'un pré-filtre grossier (le marker apparaît n'importe où) ; le step
    # `Check marker is in subject` durcit ensuite avant le merge.
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging' &&
      contains(github.event.head_commit.message, '[risk:low]') &&
      !contains(github.event.head_commit.message, '[skip-prod]') &&
      !contains(github.event.head_commit.message, '[wip]')
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          # PAT prioritaire pour bypass branch protection ;
          # GITHUB_TOKEN en fallback si pas de protection sur main.
          token: ${{ secrets.AUTO_PROMOTE_PAT || secrets.GH_AUTOPROMOTE_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Filtre fin : `[risk:low]` doit être dans le subject (1ère ligne).
      # Si présent uniquement dans le body (ex: agent qui mentionne "pas de
      # marker [risk:low]" pour expliquer son absence), on skip silencieusement
      # les steps de promotion — le job reste vert pour ne pas polluer les
      # notifs Telegram avec des "failures" cosmétiques.
      - name: Check [risk:low] is in subject line (not just body)
        id: check_subject
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          SUBJECT=$(echo "$COMMIT_MSG" | head -1)
          if echo "$SUBJECT" | grep -q '\[risk:low\]'; then
            echo "in_subject=true" >> "$GITHUB_OUTPUT"
            echo "✓ Marker [risk:low] dans le subject — auto-promote autorisée"
          else
            echo "in_subject=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Marker [risk:low] absent du subject (présent dans le body uniquement) — promotion non déclenchée. Cf. CI-ARCHITECTURE §20.4."
            echo "Subject : $SUBJECT"
          fi

      # FIX 2026-05-21 — bug auto-promote chain (sprint v1.4 retour d'XP).
      #
      # Le ff-merge ci-dessous avance main d'UN SEUL coup jusqu'au HEAD staging,
      # ce qui embarque TOUS les commits intermédiaires entre origin/main et
      # ce HEAD. Si un commit intermédiaire est tier 🟡/🔴 (pas de marker
      # [risk:low]), il passe en prod sans audit §20 alors qu'il aurait dû
      # déclencher la notif "reco agent attendue".
      #
      # Cas vécu : sprint v1.4 (10+ commits dont feat/fix tier 🟡/🔴) entièrement
      # auto-promu parce que le DERNIER commit était `[risk:low]` (env-sync).
      #
      # Fix : on inspecte chaque commit du range origin/main..HEAD. Si UN SEUL
      # n'a pas `[risk:low]` dans son subject → on skip l'auto-promote (sortie
      # propre, status notice). Le job notify-promotion-needed prendra le
      # relais en notifiant Robert que des commits non-low attendent reco.
      - name: Verify ALL commits in origin/main..HEAD have [risk:low]
        id: check_range
        if: steps.check_subject.outputs.in_subject == 'true'
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          # Subjects (1ère ligne) de chaque commit du range, séparés par \n.
          # `git log --format=%s` ne prend que le subject (pas le body), donc
          # un marker dans le body ne piégera pas le check (volontaire).
          # Format SHA + subject pour pouvoir lister les fautifs en log.
          MISSING=$(git log origin/main..HEAD --format='%H %s' | \
            awk '$0 !~ /\[risk:low\]/ { print }' || true)
          if [ -n "$MISSING" ]; then
            echo "all_low=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Auto-promote bloquée — commits sans [risk:low] dans origin/main..HEAD :"
            echo "$MISSING"
            echo "Le HEAD est [risk:low] mais des commits intermédiaires tier 🟡/🔴+ ont skip §20."
            echo "Reco agent attendue avant promotion (cf. CI-ARCHITECTURE §20.5/20.6/20.7)."
          else
            echo "all_low=true" >> "$GITHUB_OUTPUT"
            COUNT=$(git log origin/main..HEAD --oneline | wc -l)
            echo "✓ Tous les commits du range ($COUNT) portent [risk:low] — auto-promote autorisée"
          fi

      - name: Fast-forward main to staging
        if: |
          steps.check_subject.outputs.in_subject == 'true' &&
          steps.check_range.outputs.all_low == 'true'
        env:
          STAGING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main staging
          git checkout main
          if ! git merge --ff-only "$STAGING_SHA"; then
            echo "::error::main a divergé de staging — auto-promotion impossible en ff-only."
            echo "Corriger : git checkout staging && git merge --ff-only origin/main && git push origin staging"
            exit 1
          fi
          git push origin main
          echo "✓ main avancé vers $STAGING_SHA (auto-promote)"

      # Notif Telegram dédiée quand le check_range bloque (HEAD low mais
      # commits intermédiaires non-low). Sans ça, le job sort vert
      # silencieusement et Robert ne sait pas qu'une reco est due.
      - name: Telegram notify (range mixed — reco attendue)
        if: |
          steps.check_subject.outputs.in_subject == 'true' &&
          steps.check_range.outputs.all_low == 'false'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id=${TG_CHAT} \
            -d parse_mode=Markdown \
            -d "text=⛔ Hub auto-promote *bloquée* (\`${SHA7}\`) — HEAD \`[risk:low]\` mais commits intermédiaires non-low dans origin/main..HEAD.%0A%0AReco agent attendue avant promote main (CI-ARCHITECTURE §20).%0A%0ARun : ${RUN_URL}" \
            >/dev/null || true

      # GitHub n'enchaîne PAS automatiquement les workflows quand le push est
      # fait par GITHUB_TOKEN (sécurité anti-loop). On déclenche hub-ci.yml
      # explicitement pour que l'étage 3 prod tourne.
      # Gating mis à jour 2026-05-21 : ne fire QUE si check_range autorise
      # aussi la promo (sinon ff-merge n'a pas eu lieu = rien à déclencher).
      - name: Trigger hub-ci.yml on main
        if: |
          steps.check_subject.outputs.in_subject == 'true' &&
          steps.check_range.outputs.all_low == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_PROMOTE_PAT || secrets.GH_AUTOPROMOTE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run hub-ci.yml --ref main --repo ${{ github.repository }}
          echo "✓ hub-ci.yml déclenché sur main"

      - name: Telegram notify
        # Notifier seulement si on a réellement promu (HEAD low ET range all low).
        # Sur range mixed, la notif dédiée "range mixed — reco attendue"
        # ci-dessus a déjà couvert le cas. Pas besoin de spammer "skipped".
        if: |
          always() &&
          steps.check_subject.outputs.in_subject == 'true' &&
          steps.check_range.outputs.all_low == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          STATUS="${{ job.status }}"
          ICON="✓"; [ "$STATUS" != "success" ] && ICON="✗"
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id=${TG_CHAT} \
            -d "text=$ICON Hub auto-promote staging→main $STATUS (${SHA7})" \
            >/dev/null || true

  # Alerte Robert quand un push staging est vert mais que l'auto-promote NE s'est
  # PAS déclenché parce que le commit n'est pas tier 🟢 BAS. Le but : Robert sait
  # qu'une reco écrite agent est attendue selon CI-ARCHITECTURE §20.5/20.6/20.7.
  #
  # Fire UNIQUEMENT si le commit n'a PAS de marker [risk:low] (sinon l'autre job
  # gère la promo et la notif).
  notify-promotion-needed:
    name: Notify Robert — reco agent attendue (tier 🟡+)
    needs: deploy
    runs-on: ubuntu-latest
    # On laisse fire AUSSI si le marker [risk:low] est dans le body seulement
    # (faux positif corrigé par le step `check-subject` ci-dessous, qui zappe
    # la notif si effectivement le subject porte le marker).
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging' &&
      !contains(github.event.head_commit.message, '[skip-prod]') &&
      !contains(github.event.head_commit.message, '[wip]')
    steps:
      - name: Skip si marker dans le subject (commit tier 🟢 BAS)
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(echo "$COMMIT_MSG" | head -1)
          if echo "$SUBJECT" | grep -q '\[risk:low\]'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Subject porte [risk:low] — pas de notif, auto-promote prend le relais"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Telegram notify Robert
        if: steps.check.outputs.skip != 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          MSG="${{ github.event.head_commit.message }}"
          MSG_FIRST_LINE=$(echo "$MSG" | head -1)
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id=${TG_CHAT} \
            -d parse_mode=Markdown \
            -d "text=⏸ Hub staging vert (\`${SHA7}\`) — *reco agent attendue* (tier 🟡+).%0A%0A_${MSG_FIRST_LINE}_%0A%0ARun : ${RUN_URL}%0AProtocole : CI-ARCHITECTURE §20" \
            >/dev/null || true

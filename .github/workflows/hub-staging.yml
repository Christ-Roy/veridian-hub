name: Hub Staging (dev server)

# Convention officielle Veridian (CLAUDE.md racine §Staging) :
#   - 1 stack staging fixe sur hub.staging.veridian.site
#   - Trigger : push sur branche `staging`
#   - Pas d'éphémère par PR, pas de teardown auto
#   - Deploy via SSH dev-pub → docker compose up
#
# Pour valider une PR sur staging avant merge main :
#   1. Push la branche feature/fix → travailler dessus
#   2. Une fois prête, merger (ou cherry-pick) dans `staging`
#   3. Ce workflow se déclenche → deploy automatique
#   4. Smoke + validation manuelle sur https://hub.staging.veridian.site
#   5. Si OK → PR de feature → main → prod

on:
  push:
    branches: [staging]
    paths-ignore:
      - 'todo/**'
      - '_archive/**'
      - 'docs/**'
      - 'runbooks/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: hub-staging-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: christ-roy/veridian-hub
  STAGING_DIR: /opt/staging/hub
  STAGING_URL: https://hub.staging.veridian.site

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      vars.STAGING_HOST != '' && vars.STAGING_USER != ''
    # GitHub Environment `staging` — permet tracking centralisé des deploys
    # staging et scoping futur des secrets STAGING_* à scope env.
    environment:
      name: staging
      url: https://hub.staging.veridian.site
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Compute image tag
        id: tag
        run: |
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image-tag=staging-$SHA7" >> $GITHUB_OUTPUT
          echo "Building staging-$SHA7"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          retry_on: error
          command: |
            docker buildx build \
              --target runner \
              --push \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image-tag }} \
              -f ./Dockerfile \
              .

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEV_HOST: ${{ vars.STAGING_HOST }}
        run: |
          MISSING=""
          [ -z "$SSH_KEY" ] && MISSING="$MISSING STAGING_SSH_KEY"
          [ -z "$DEV_HOST" ] && MISSING="$MISSING STAGING_HOST"
          if [ -n "$MISSING" ]; then
            echo "::error::Staging credentials missing:$MISSING"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "$DEV_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy stack
        env:
          DEV_HOST: ${{ vars.STAGING_HOST }}
          DEV_USER: ${{ vars.STAGING_USER }}
          IMAGE_TAG: ${{ steps.tag.outputs.image-tag }}
          HUB_AUTH_SECRET: ${{ secrets.STAGING_HUB_AUTH_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          # Secrets cross-app : doivent être identiques aux containers
          # prospection-staging (TENANT_API_SECRET) et notifuse-staging
          # (HUB_API_SECRET / HUB_WEBHOOK_SECRET). Sans ça, le compose
          # fallback sur "staging-secret" → 401 Invalid signature sur tous
          # les appels Hub → Prospection / Notifuse.
          PROSPECTION_TENANT_API_SECRET_STAGING: ${{ secrets.PROSPECTION_TENANT_API_SECRET_STAGING }}
          NOTIFUSE_HUB_API_SECRET_STAGING: ${{ secrets.NOTIFUSE_HUB_API_SECRET_STAGING }}
          NOTIFUSE_HUB_WEBHOOK_SECRET_STAGING: ${{ secrets.NOTIFUSE_HUB_WEBHOOK_SECRET_STAGING }}
          # ⚠️ OAuth Sign-in (Google/Microsoft) PAS configuré côté staging
          # à cause de la privatisation Tailscale (hub.staging.veridian.site
          # → IP Tailscale 100.92.215.42 non résolvable publiquement). Si on
          # déclarait cette redirect URI côté Google/Microsoft, les providers
          # feraient un check public qui échouerait → red flag réputation
          # potentiel pour le Client OAuth Veridian Hub partagé avec prod.
          #
          # Décision 2026-05-20 (cf. memory reference_staging_tailscale_privatisation.md) :
          # - Staging = test du flow non-OAuth (credentials + magic link)
          # - Test OAuth = en local-dev (avec Client dev → localhost:3000) ou
          #   en prod direct
          # - LoginForm.tsx + SignupForm.tsx cachent les boutons OAuth si
          #   DEPLOY_ENV=staging via NEXT_PUBLIC_DEPLOY_ENV
        run: |
          set -euo pipefail

          # SCP composes (base + staging uniquement, pas prod.yml).
          ssh -i ~/.ssh/staging_key "$DEV_USER@$DEV_HOST" "mkdir -p ${{ env.STAGING_DIR }}/compose"
          scp -i ~/.ssh/staging_key compose/base.yml "$DEV_USER@$DEV_HOST:${{ env.STAGING_DIR }}/compose/"
          scp -i ~/.ssh/staging_key compose/staging.yml "$DEV_USER@$DEV_HOST:${{ env.STAGING_DIR }}/compose/"

          # .env de la stack (chargé automatiquement par compose dans le CWD)
          ENVFILE="$(mktemp)"
          {
            printf 'HUB_IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'HUB_AUTH_SECRET=%s\n' "$HUB_AUTH_SECRET"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'PROSPECTION_TENANT_API_SECRET_STAGING=%s\n' "$PROSPECTION_TENANT_API_SECRET_STAGING"
            printf 'NOTIFUSE_HUB_API_SECRET_STAGING=%s\n' "$NOTIFUSE_HUB_API_SECRET_STAGING"
            printf 'NOTIFUSE_HUB_WEBHOOK_SECRET_STAGING=%s\n' "$NOTIFUSE_HUB_WEBHOOK_SECRET_STAGING"
          } > "$ENVFILE"
          scp -i ~/.ssh/staging_key "$ENVFILE" "$DEV_USER@$DEV_HOST:${{ env.STAGING_DIR }}/.env"
          rm -f "$ENVFILE"
          ssh -i ~/.ssh/staging_key "$DEV_USER@$DEV_HOST" "chmod 600 ${{ env.STAGING_DIR }}/.env"

          # Pull + up (1 seule stack fixe, recycle des containers existants)
          ssh -i ~/.ssh/staging_key "$DEV_USER@$DEV_HOST" \
            "cd ${{ env.STAGING_DIR }} && docker compose -p hub-staging --env-file .env -f compose/base.yml -f compose/staging.yml pull"
          ssh -i ~/.ssh/staging_key "$DEV_USER@$DEV_HOST" \
            "cd ${{ env.STAGING_DIR }} && docker compose -p hub-staging --env-file .env -f compose/base.yml -f compose/staging.yml up -d --remove-orphans"

          # Attendre healthcheck OK
          echo "Waiting for hub-staging to become healthy..."
          for i in $(seq 1 30); do
            STATUS=$(ssh -i ~/.ssh/staging_key "$DEV_USER@$DEV_HOST" \
              "docker inspect hub-staging --format '{{.State.Health.Status}}' 2>/dev/null" || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "Healthy after $((i*10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Container hub-staging not healthy after 5min"
          ssh -i ~/.ssh/staging_key "$DEV_USER@$DEV_HOST" \
            "docker logs hub-staging --tail 100" || true
          exit 1

      # Staging accessible UNIQUEMENT via le tailnet Veridian depuis 2026-05-19
      # (cf docs/CONTRAT-HUB.md §8.6). DNS *.staging.veridian.site → IP
      # Tailscale 100.92.215.42, Traefik écoute uniquement cette interface.
      # Le runner GitHub Actions rejoint le tailnet via OAuth (tag:ci-github)
      # avant de hit l'URL staging.
      - name: Tailscale (connect runner to tailnet for staging smoke)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-github
          version: latest

      - name: Smoke test staging URL
        run: |
          echo "Smoke test: ${{ env.STAGING_URL }}/api/health (via Tailscale)"
          for i in $(seq 1 6); do
            if curl -sf --max-time 10 "${{ env.STAGING_URL }}/api/health" | grep -q '"status":"ok"'; then
              echo "✓ Staging healthy: ${{ env.STAGING_URL }}"
              exit 0
            fi
            echo "Attempt $i: not ready, retry in 10s..."
            sleep 10
          done
          echo "::error::Smoke failed after 60s on ${{ env.STAGING_URL }}"
          exit 1

      - name: Cleanup local runner
        if: always()
        run: |
          docker container prune -f || true
          docker image prune -f --filter "until=1h" || true
          rm -f ~/.ssh/staging_key

  # Auto-promote staging → main — UNIQUEMENT pour les commits tier 🟢 BAS.
  # Cf. CI-ARCHITECTURE.md §20 "Promotion graduée par risque" (2026-05-20).
  #
  # Hub est désormais classifié 🔴 Critique (SSO central + billing + provisioning).
  # L'auto-promote ne déclenche QUE si le commit porte explicitement le marker
  # `[risk:low]` dans son message — pour les docs, todo, tests sans modif source,
  # et autres changements sans impact applicatif.
  #
  # Pour tout autre commit (tier 🟡 MOYEN / 🔴 HAUT / 💀 CRITIQUE) :
  #   1. CI staging s'exécute normalement (build + deploy + smoke).
  #   2. Ce job ne fire pas.
  #   3. Le job `notify-promotion-needed` ci-dessous alerte Robert via Telegram
  #      qu'une reco écrite agent est attendue avant promote main.
  #   4. L'agent produit la reco selon le protocole §20.5/20.6/20.7.
  #   5. Robert répond `go` / `stop` ; sur `go` l'agent fait la promotion
  #      manuelle (ff-merge + push main + trigger hub-ci.yml).
  #
  # Garde-fous conservés :
  #   - needs: deploy → si build ou smoke staging KO, pas de promotion
  #   - merge --ff-only strict → fail si main a divergé (pas de force-push)
  #   - marker `[risk:low]` est vérifié côté pre-push hook par check-risk-marker.sh
  #     (refuse les commits qui claim [risk:low] mais touchent un chemin tier 🔴+)
  #
  # Pré-requis inchangés :
  #   - Secret repo AUTO_PROMOTE_PAT (PAT scope `repo` + `workflow`) si la
  #     branche main est protégée par branch protection avec status checks ;
  #     sinon GITHUB_TOKEN suffit.
  promote-to-main:
    name: Auto-promote staging → main (🟢 risk:low only)
    needs: deploy
    runs-on: ubuntu-latest
    # Marker `[risk:low]` doit être dans le subject (1ère ligne) du commit.
    # GitHub Actions n'a pas de fonction "split first line" sur head_commit.message,
    # donc on utilise un step préalable côté shell. Le `if:` ci-dessous ne fait
    # qu'un pré-filtre grossier (le marker apparaît n'importe où) ; le step
    # `Check marker is in subject` durcit ensuite avant le merge.
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging' &&
      contains(github.event.head_commit.message, '[risk:low]') &&
      !contains(github.event.head_commit.message, '[skip-prod]') &&
      !contains(github.event.head_commit.message, '[wip]')
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # PAT prioritaire pour bypass branch protection ;
          # GITHUB_TOKEN en fallback si pas de protection sur main.
          token: ${{ secrets.AUTO_PROMOTE_PAT || secrets.GH_AUTOPROMOTE_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Filtre fin : `[risk:low]` doit être dans le subject (1ère ligne).
      # Si présent uniquement dans le body (ex: agent qui mentionne "pas de
      # marker [risk:low]" pour expliquer son absence), on skip silencieusement
      # les steps de promotion — le job reste vert pour ne pas polluer les
      # notifs Telegram avec des "failures" cosmétiques.
      - name: Check [risk:low] is in subject line (not just body)
        id: check_subject
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          SUBJECT=$(echo "$COMMIT_MSG" | head -1)
          if echo "$SUBJECT" | grep -q '\[risk:low\]'; then
            echo "in_subject=true" >> "$GITHUB_OUTPUT"
            echo "✓ Marker [risk:low] dans le subject — auto-promote autorisée"
          else
            echo "in_subject=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Marker [risk:low] absent du subject (présent dans le body uniquement) — promotion non déclenchée. Cf. CI-ARCHITECTURE §20.4."
            echo "Subject : $SUBJECT"
          fi

      - name: Fast-forward main to staging
        if: steps.check_subject.outputs.in_subject == 'true'
        env:
          STAGING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main staging
          git checkout main
          if ! git merge --ff-only "$STAGING_SHA"; then
            echo "::error::main a divergé de staging — auto-promotion impossible en ff-only."
            echo "Corriger : git checkout staging && git merge --ff-only origin/main && git push origin staging"
            exit 1
          fi
          git push origin main
          echo "✓ main avancé vers $STAGING_SHA (auto-promote)"

      # GitHub n'enchaîne PAS automatiquement les workflows quand le push est
      # fait par GITHUB_TOKEN (sécurité anti-loop). On déclenche hub-ci.yml
      # explicitement pour que l'étage 3 prod tourne.
      - name: Trigger hub-ci.yml on main
        if: steps.check_subject.outputs.in_subject == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_PROMOTE_PAT || secrets.GH_AUTOPROMOTE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run hub-ci.yml --ref main --repo ${{ github.repository }}
          echo "✓ hub-ci.yml déclenché sur main"

      - name: Telegram notify
        # Notifier seulement si on a réellement promu (marker dans subject).
        # Si le marker n'était que dans le body, le job sort vert sans rien
        # faire — l'autre job (notify-promotion-needed) gère la notif "reco
        # attendue". Pas besoin de spammer "auto-promote skipped".
        if: always() && steps.check_subject.outputs.in_subject == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          STATUS="${{ job.status }}"
          ICON="✓"; [ "$STATUS" != "success" ] && ICON="✗"
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id=${TG_CHAT} \
            -d "text=$ICON Hub auto-promote staging→main $STATUS (${SHA7})" \
            >/dev/null || true

  # Alerte Robert quand un push staging est vert mais que l'auto-promote NE s'est
  # PAS déclenché parce que le commit n'est pas tier 🟢 BAS. Le but : Robert sait
  # qu'une reco écrite agent est attendue selon CI-ARCHITECTURE §20.5/20.6/20.7.
  #
  # Fire UNIQUEMENT si le commit n'a PAS de marker [risk:low] (sinon l'autre job
  # gère la promo et la notif).
  notify-promotion-needed:
    name: Notify Robert — reco agent attendue (tier 🟡+)
    needs: deploy
    runs-on: ubuntu-latest
    # On laisse fire AUSSI si le marker [risk:low] est dans le body seulement
    # (faux positif corrigé par le step `check-subject` ci-dessous, qui zappe
    # la notif si effectivement le subject porte le marker).
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging' &&
      !contains(github.event.head_commit.message, '[skip-prod]') &&
      !contains(github.event.head_commit.message, '[wip]')
    steps:
      - name: Skip si marker dans le subject (commit tier 🟢 BAS)
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(echo "$COMMIT_MSG" | head -1)
          if echo "$SUBJECT" | grep -q '\[risk:low\]'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Subject porte [risk:low] — pas de notif, auto-promote prend le relais"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Telegram notify Robert
        if: steps.check.outputs.skip != 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          MSG="${{ github.event.head_commit.message }}"
          MSG_FIRST_LINE=$(echo "$MSG" | head -1)
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id=${TG_CHAT} \
            -d parse_mode=Markdown \
            -d "text=⏸ Hub staging vert (\`${SHA7}\`) — *reco agent attendue* (tier 🟡+).%0A%0A_${MSG_FIRST_LINE}_%0A%0ARun : ${RUN_URL}%0AProtocole : CI-ARCHITECTURE §20" \
            >/dev/null || true

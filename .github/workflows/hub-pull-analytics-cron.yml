name: Hub — Pull Analytics (hourly)

# Cron qui déclenche le pull Analytics → events comportementaux prospect.
#
# Pull export.userEvents (fenêtre fixe 48 h) → agrège par identité → ingère
# `page.hit` (scorable) + jalons audit via ingestProspectEvent. Porté du bridge
# `veridian-tunnel-de-vente` (doctrine « clean et smart » Robert).
#
# Idempotence : idempotency_key DÉTERMINISTE côté Hub → re-pull horaire de la
# même fenêtre 48 h = 0 doublon. Pas de curseur persistant à gérer.
#
# Fréquence horaire = compromis réactivité (un signal web remonté en < 1 h sans
# webhook) / coût (24 runs/jour × ~10 s = négligeable). La fenêtre 48 h donne la
# marge pour rattraper un run raté (panne CI, deploy) sans perdre d'event.
#
# Secret `CRON_SECRET` : déjà provisionné (partagé avec les autres crons Hub).
# Credentials engine (ENGINE_ADMIN_*) : côté compose prod du Hub, pas en CI.
# Si absents, la route répond `skipped: true` (200) — pas d'échec.

on:
  schedule:
    - cron: '37 * * * *' # h+37 pour étaler vs reconcile (h+17) et trial-tick
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-analytics:
    name: Pull Analytics
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/cron/pull-analytics on prod
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret manquant dans GH Secrets"
            exit 1
          fi

          URL="https://app.veridian.site/api/cron/pull-analytics"

          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 300 \
            --retry 2 --retry-delay 10)

          echo "HTTP $HTTP_CODE"
          cat /tmp/resp.json || true
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Pull Analytics tick failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Notify Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -sf -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id=${TG_CHAT} \
            -d parse_mode=Markdown \
            -d "text=Pull Analytics cron *FAIL*. Run : ${RUN_URL}" \
            >/dev/null || true
